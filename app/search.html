<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>hitomi hub search</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #14161a;
    --surface: #1d2126;
    --border: #2f343b;
    --border-soft: #23272d;
    --text: #e8eaed;
    --muted: #9aa0a6;
    --link: #8ab4f8;
    --error: #f0a441;
    --focus: #8ab4f8;
    --button: #2f343b;
    --button-hover: #383e47;
    --button-active: #262b32;
    --highlight: #ffd166;
    --font-ui: system-ui, "Segoe UI", "Yu Gothic UI", "Meiryo", sans-serif;
    --radius: 6px;
    --space-1: .25rem;
    --space-2: .5rem;
    --space-3: .75rem;
    --space-4: 1rem;
    --tap-min: 34px;
    --speed-fast: 120ms;
  }
  body { font-family: var(--font-ui); margin: var(--space-4); background: var(--bg); color: var(--text); height: calc(100vh - var(--space-4) * 2); overflow: hidden; display: flex; flex-direction: column; }
  h1 { font-size: 1.1rem; margin: 0 0 var(--space-3); }
  nav { font-size: .9rem; margin-bottom: var(--space-2); }
  .cols { display: flex; gap: var(--space-4); align-items: flex-start; flex: 1; min-height: 0; }
  .side { width: 30rem; min-width: 30rem; flex-shrink: 0; height: 100%; min-height: 0; overflow-y: auto; }
  .main { flex: 1; min-width: 20rem; height: 100%; min-height: 0; overflow-y: auto; }
  .side, .main { scroll-padding-top: 44px; }
  @media (prefers-reduced-motion: no-preference) { .side, .main { scroll-behavior: smooth; } }
  section { margin-bottom: var(--space-4); }
  h2 { font-size: .95rem; margin: 0 0 var(--space-2); color: var(--muted); }
  form { display: flex; gap: var(--space-2); flex-wrap: wrap; align-items: center; }
  input { padding: var(--space-1) var(--space-2); min-height: var(--tap-min); background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius); font: inherit; }
  button { padding: var(--space-1) var(--space-3); min-height: var(--tap-min); background: var(--button); color: var(--text); border: 0; border-radius: var(--radius); cursor: pointer; font: inherit; transition: background var(--speed-fast) ease, box-shadow var(--speed-fast) ease; }
  button:hover { background: var(--button-hover); }
  button:active { background: var(--button-active); box-shadow: 0 1px 3px rgba(0, 0, 0, .35); }
  input:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  form#search { gap: var(--space-2); }
  form#search .search-row, form#search .filter-row { flex-basis: 100%; display: flex; flex-wrap: nowrap; gap: var(--space-2); align-items: center; }
  form#search .pager { flex-shrink: 0; display: flex; flex-wrap: nowrap; gap: var(--space-2); align-items: center; }
  form#search .pager button { min-width: 40px; }
  form#search input, form#search button { box-sizing: border-box; min-height: var(--tap-min); }
  form#search input[type="checkbox"] { min-height: auto; }
  form#search button:disabled { opacity: .5; cursor: not-allowed; }
  form#search #query { flex: 1 1 160px; min-width: 0; }
  form#search #search-page-status { margin-left: auto; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: .3rem 0; border-bottom: 1px solid var(--border-soft); }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .meta { font-size: .9rem; color: var(--muted); }
  .error { font-size: .85rem; color: #f0a441; }
  .status { font-size: .85rem; color: var(--focus); margin-bottom: .4rem; }
  .card { display: flex; gap: var(--space-2); align-items: flex-start; --search-card-height: 130px; height: var(--search-card-height); overflow: hidden; border-radius: var(--radius); transition: background-color var(--speed-fast) ease; }
  .card:hover { background-color: #1b1f25; }
  .card .text { display: flex; flex-direction: column; min-height: 0; max-height: calc(var(--search-card-height) - 2rem); overflow: hidden; }
  .card .badge { font-size: .8rem; color: var(--focus); }
  .card .badge:empty { display: none; }
  .card .badge button { padding: .15rem .4rem; min-height: 24px; font-size: .75rem; }
  .card .meta button { padding: .15rem .4rem; min-height: 24px; font-size: .75rem; }
  .card .meta button:disabled { opacity: .5; cursor: not-allowed; }
  .card .badge .flag { font-weight: 600; }
  .card .badge .flag-viewed { color: #7cc3fa; }
  .card .badge .flag-read { color: #4db6ac; }
  .card .badge .flag-saved { color: #ff8a65; }
  .card .badge .flag-favorite { color: #c77dff; }
  .card.has-status { background-color: #252a31; box-shadow: inset 0 0 0 2px #8ab4f8; border-radius: 6px; }
  .card.highlight { outline: 2px solid var(--highlight); border-radius: var(--radius); }
  .card[data-busy] { animation: ui-pulse 1.2s ease-in-out infinite; }
  .search-card-cover { object-fit: cover; background: var(--surface); border-radius: var(--radius); }
  .search-card-cover { width: 130px; height: 130px; }
  .card a { font-weight: 600; }
  .tags {
    font-size: .9rem;
    line-height: 1.25;
    max-height: calc(var(--search-card-height) - 2rem);
    overflow: hidden;
    overflow-wrap: anywhere;
    display: -webkit-box;
    -webkit-line-clamp: 9;
  }
  @keyframes ui-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .7; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
  html.fullscreen h1, body.fullscreen h1, html.fullscreen nav.page-nav, body.fullscreen nav.page-nav, body.pseudo-fullscreen nav.page-nav, html.fullscreen section, body.fullscreen section, body.pseudo-fullscreen section, html.fullscreen .meta, body.fullscreen .meta, body.pseudo-fullscreen .meta, html.fullscreen .side, body.fullscreen .side, body.pseudo-fullscreen .side { display: none; }
</style>
</head>
<body>
<h1>hitomi hub search（検索ページ）</h1>
<nav class="page-nav"><a href="/">閲覧</a> <button id="jump-first-status" type="button">最初のステータス付きページへ</button></nav>
<div class="cols">
  <div class="side">
    <section>
      <h2>検索（hitomi search.html と同じ term routing）</h2>
      <form id="search">
        <div class="search-row">
          <input id="query" value="furry" size="30" placeholder="furry / female:yuri language:english" aria-label="検索 term">
          <input id="lang" value="all" size="8" aria-label="言語">
          <button id="search-submit" type="submit">検索</button>
        </div>
        <span class="pager">
          <button id="search-prev" type="button">前</button>
          <input id="page" value="1" size="4" inputmode="numeric" aria-label="ページ">
          <button id="search-next" type="button">次</button>
        </span>
        <div id="search-page-status" class="meta" role="status"></div>
        <div class="filter-row series-type-filter-row">
          <input id="series-filter" value="" size="22" placeholder="Series（絞り込みなし）" aria-label="Series filter">
          <span class="type-filter-options" role="group" aria-label="Type filter">
            <label><input type="checkbox" id="type-filter-manga" value="manga" data-type-filter> manga</label>
            <label><input type="checkbox" id="type-filter-doujinshi" value="doujinshi" data-type-filter> doujinshi</label>
            <label><input type="checkbox" id="type-filter-manhua" value="manhua" data-type-filter> manhua</label>
            <label><input type="checkbox" id="type-filter-manhwa" value="manhwa" data-type-filter> manhwa</label>
            <label><input type="checkbox" id="type-filter-other" value="other" data-type-filter> other</label>
          </span>
        </div>
        <div class="filter-row">
          <label><input type="checkbox" id="status-viewed" value="viewed" data-status-filter>表示済み</label>
          <label><input type="checkbox" id="status-read" value="read" data-status-filter>既読</label>
          <label><input type="checkbox" id="status-saved" value="saved" data-status-filter>保存済み</label>
          <label><input type="checkbox" id="status-favorite" value="favorite" data-status-filter>お気に入り</label>
        </div>
      </form>
      <div id="perf-status" class="meta"></div>
      <div id="search-status" class="status" role="status" aria-live="polite"></div>
      <div id="count" class="meta"></div>
    </section>
    <section>
      <h2>保存検索</h2>
      <form id="saved-search">
        <input id="qname" placeholder="名前" size="10" aria-label="名前">
        <input id="qtext" placeholder="female:yuri language:english" size="22" aria-label="term">
        <button>保存</button>
      </form>
      <ul id="queries"></ul>
    </section>
    <section>
      <h2>お気に入り / 未読</h2>
      <div><button id="lists-refresh" type="button">一覧更新</button></div>
      <ul id="favorites"></ul>
      <ul id="unread"></ul>
    </section>
  </div>
  <div class="main">
    <ul id="results"></ul>
  </div>
</div>
<script>
const api = (p) => fetch(p, { cache: "no-store" }).then(async (r) => {
  const data = await r.json().catch(() => ({}));
  data._x_cache = r.headers.get("x-cache") || null;
  data._x_search_timing = r.headers.get("x-search-timing") || null;
  if (!r.ok) {
    const err = new Error(data.error || (r.status + " " + p));
    err.status = r.status;
    throw err;
  }
  return data;
});
const post = (p, body) => fetch(p, { method: "POST", headers: { "content-type": "application/json" },
  body: JSON.stringify(body) }).then(async (r) => {
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || (r.status + " " + p));
  return data;
});

const newTabMode = new URLSearchParams(window.location.search).get("newtab") === "1";
const SEARCH_STORAGE_KEY = "hitomi_hub_last_search";
const TITLE_GROUPS_STORAGE_KEY = "hitomi_hub_title_groups";
const SEARCH_CARD_CONCURRENCY = 8;
const FIRST_VISIBLE_EAGER_COVER_COUNT = 8;
const readListsDebounceMs = 250;
let listsDebounceTimer = null;
let listsWaiters = [];
let listsFetchPending = null;
let pendingHighlightId = null;
const readStateByGallery = new Map();
const favoriteByGallery = new Map();
const savedByGallery = new Map();
let searchGeneration = 0;
let currentSearchTotal = 0;
let perfStatus = { searchMs: 0, serverTiming: "", cardsLoaded: 0, cardTotalMs: 0, cacheDistribution: {} };
const titleGroups = new Map();

function escapeHTML(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}
function targetAttr() {
  return newTabMode ? " target='_blank'" : "";
}
// cross-page viewer link: search page lives at /search, viewer page at /. The link must be absolute to "/" so a fragment-only navigation cannot stay on the search page.
function viewerLink(id, page) {
  const base = "/#/g/" + id;
  return page && page > 1 ? base + "/page/" + page : base;
}
function setStatus(status, message, isError = false) {
  if (!status) return;
  status.classList.toggle("error", isError);
  status.textContent = message;
}

function thumbURL(hash, format, gallery, variant) {
  if (!hash) return "";
  let u = "/api/thumb/" + hash + "?format=" + encodeURIComponent(format || "webp");
  if (gallery) u += "&gallery=" + encodeURIComponent(gallery);
  if (variant) u += "&variant=" + encodeURIComponent(variant);
  return u;
}

function normalizeTitleKey(r) {
  return String(r.title || r.japanese_title || r.id || "").trim().toLowerCase();
}

function loadTitleGroups() {
  try {
    const raw = JSON.parse(localStorage.getItem(TITLE_GROUPS_STORAGE_KEY));
    if (!raw) return;
    for (const [key, group] of Object.entries(raw)) titleGroups.set(key, group);
  } catch (err) {}
}

function saveTitleGroups() {
  try {
    localStorage.setItem(TITLE_GROUPS_STORAGE_KEY, JSON.stringify(Object.fromEntries(titleGroups)));
  } catch (err) {}
}

function setSearchTitleGroup(r) {
  const key = normalizeTitleKey(r);
  if (!key || r.id === undefined) return;
  const existing = titleGroups.get(key);
  if (!existing || existing.language !== "japanese" || r.language === "japanese") {
    titleGroups.set(key, { bestId: r.id, language: r.language || "", name: r.japanese_title || r.title || String(r.id) });
    saveTitleGroups();
  }
}

function sameTitleJapaneseAnchor(r) {
  const key = normalizeTitleKey(r);
  const group = titleGroups.get(key);
  if (!key || !group || r.language === "japanese" || group.language !== "japanese" || Number(group.bestId) === Number(r.id)) return "";
  return "<div class='meta'>同名の日本語版: <a href='" + viewerLink(group.bestId) + "'" + targetAttr() + ">#" + group.bestId + "</a></div>";
}

// Manual Japanese search button (task 2026-11-06). Separate helper from normalizeTitleKey; the
// existing group key semantics are unchanged. Inline control on the existing .meta row only
// (no new row, card height contract kept). TN lane, prefetchQueue, saved query are not touched.
const manualSearchInFlightKeys = new Set();

function manualJapaneseSearchTerm(card) {
  const raw = card.japanese_title || card.title || "";
  return String(raw).trim().toLowerCase().replace(/_/g, " ");
}

function manualSearchQueryUrl(term) {
  return "/api/search?query=" + encodeURIComponent(term + " language:japanese") + "&lang=all&limit=1";
}

// non-Japanese card only, only while the Japanese bestId is not yet known in titleGroups
function manualSearchButtonHTML(card) {
  if (!card || card.error || card.language === "japanese") return "";
  const key = normalizeTitleKey(card);
  const group = key ? titleGroups.get(key) : null;
  if (group && group.language === "japanese") return "";
  const term = manualJapaneseSearchTerm(card);
  if (!term) return "";
  return " <button type='button' data-manual-jp-search data-state='idle' data-term='" + escapeHTML(term) + "' data-key='" + escapeHTML(key) + "'>日本版を検索</button>";
}

function manualSearchMessageSpan(state, message) {
  const span = document.createElement("span");
  span.className = state === "error" ? "error" : "meta";
  span.textContent = message;
  return span;
}

function manualSearchSetState(row, btn, state, message) {
  btn.dataset.state = state;
  btn.disabled = state === "busy";
  if (message) row.appendChild(manualSearchMessageSpan(state, message));
}

// found state: same row only. The button is replaced by the link; no whole-card re-render and
// no immediate DOM update of other cards sharing the same normalized key (v1).
function manualSearchShowFound(row, btn, group) {
  btn.remove();
  row.appendChild(document.createTextNode("同名の日本語版: "));
  const link = document.createElement("a");
  link.href = viewerLink(group.bestId);
  if (newTabMode) link.target = "_blank";
  link.textContent = "#" + group.bestId;
  row.appendChild(link);
  btn.dataset.state = "found";
}

async function handleManualJapaneseSearchClick(e) {
  const btn = e.target.closest("button[data-manual-jp-search]");
  if (!btn) return;
  const row = btn.closest(".meta");
  if (!row) return;
  const gen = searchGeneration;
  const key = btn.dataset.key || "";
  const term = btn.dataset.term || "";

  const known = key ? titleGroups.get(key) : null;
  if (known && known.language === "japanese") {
    manualSearchShowFound(row, btn, known);
    return;
  }

  if (key && manualSearchInFlightKeys.has(key)) {
    manualSearchSetState(row, btn, "busy", "");
    return;
  }

  if (!term) {
    manualSearchSetState(row, btn, "none", "exact term がありません");
    return;
  }

  // colon title: the query parser can misread it as a field term. Explicitly unsupported until
  // live confirmation (plan step 2・8・confirmed unsupported 2026-11-06, see Verification).
  if (term.indexOf(":") >= 0) {
    manualSearchSetState(row, btn, "none", "colon を含む title は unsupported（field term 誤読リスク）");
    return;
  }

  if (Date.now() < prefetchCooldownUntil) {
    manualSearchSetState(row, btn, "error", "日本版検索は cooldown 明けまで fetch しない");
    return;
  }

  manualSearchSetState(row, btn, "busy", "");
  manualSearchInFlightKeys.add(key);
  try {
    const data = await api(manualSearchQueryUrl(term));
    if (gen !== searchGeneration) return;
    const ids = data.ids || (data.results || []).map((r) => r.id);
    if (!ids.length) {
      manualSearchSetState(row, btn, "none", "exact term に結果なし");
      return;
    }
    const resultCard = await api("/api/search-card/" + ids[0]);
    if (gen !== searchGeneration) return;
    if (resultCard.error || resultCard.language !== "japanese") {
      manualSearchSetState(row, btn, "none", "result card は Japanese ではなし");
      return;
    }
    setSearchTitleGroup(resultCard);
    const group = titleGroups.get(key) || titleGroups.get(normalizeTitleKey(resultCard));
    manualSearchShowFound(row, btn, group);
  } catch (err) {
    if (gen !== searchGeneration) return;
    manualSearchSetState(row, btn, "error", "日本版検索エラー: " + err.message);
  } finally {
    if (key) manualSearchInFlightKeys.delete(key);
  }
}

function badgeFlag(label, className) {
  return "<span class='flag " + className + "'>" + escapeHTML(label) + "</span>";
}

function hasStatus(id) {
  const state = readStateByGallery.get(id);
  return Boolean((state && state.viewed) || (state && state.fully_read) || savedByGallery.get(id) || favoriteByGallery.has(id));
}

function hasResetStatus(id) {
  const state = readStateByGallery.get(id);
  return Boolean((state && state.viewed) || (state && state.fully_read) || favoriteByGallery.has(id));
}

// 3 state flags are separated by distinct classes so each flag can have its own visible color.
function badgeText(id) {
  const parts = [];
  const state = readStateByGallery.get(id);
  if (state && state.viewed) parts.push(badgeFlag("表示済み", "flag-viewed"));
  if (state && state.fully_read) parts.push(badgeFlag("既読", "flag-read"));
  if (savedByGallery.get(id)) parts.push(badgeFlag("保存済み", "flag-saved"));
  if (favoriteByGallery.has(id)) parts.push(badgeFlag("お気に入り", "flag-favorite"));
  return parts.join(" ");
}

// badge 行 inline に reset button（同一行・行を追加しない）。card height contract を越えない。
function cardStatusClass(id) {
  return hasStatus(id) ? " has-status" : "";
}

function badgeInner(id) {
  const parts = [badgeText(id)];
  if (hasResetStatus(id)) parts.push("<button type='button' data-reset='all'>リセット</button>");
  return parts.join(" ");
}

function badgeRow(id) {
  return "<div class='badge'>" + badgeInner(id) + "</div>";
}

function renderSearchCard(r, opts = {}) {
  setSearchTitleGroup(r);
  const tags = (r.tags || []).join(", ");
  const tagsTitle = tags ? " title='" + escapeHTML(tags) + "'" : "";
  const anchor = sameTitleJapaneseAnchor(r);
  const thumbnail = searchCardCoverSource(r);
  const loadingAttr = opts.highPriority ? "loading='eager' fetchpriority='high'" : "loading='lazy'";
  const cover = "<img class='search-card-cover' data-search-id='" + r.id + "' data-thumbnail='" + escapeHTML(thumbnail) + "' " + loadingAttr + " src='' alt='cover'>";
  const localCount = (r.files || []).filter((f) => f.local).length;
  const manualButton = manualSearchButtonHTML(r);
  return "<li class='card" + cardStatusClass(r.id) + "' data-search-id='" + r.id + "'><a href='" + viewerLink(r.id) + "'" + targetAttr() + ">" + cover + "</a><div class='text'><a href='" + viewerLink(r.id) + "'" + targetAttr() + ">" + escapeHTML(r.title || r.error || r.id) + "</a>" + badgeRow(r.id) + "<div class='meta'>" + escapeHTML(r.language || "") + " / " + escapeHTML(r.type || "") + "・" + (r.count ?? 0) + " files・local " + localCount + "/" + (r.count ?? 0) + manualButton + "</div><div class='tags meta'" + tagsTitle + ">" + escapeHTML(tags) + "</div>" + anchor + "</div></li>";
}

function searchCardCoverSource(card) {
  return card.thumbnail || (card.files && card.files[0] ? thumbURL(card.files[0].hash, card.format, card.id, "bigtn") : "");
}

// pure TN cover: the search page does not own the objectURL cache, so the cover source is only the server TN URL. No full objectURL preference, no current priority wait.
async function loadSearchCardCover(r, searchGen = searchGeneration, highPriority = false) {
  if (searchGen !== searchGeneration) return;
  const img = document.getElementById("results").querySelector("img[data-search-id=\"" + r.id + "\"]");
  if (!img) return;
  if (highPriority) img.fetchPriority = "high";
  const src = searchCardCoverSource(r);
  if (src) img.src = src;
}

function parseSearchHash(hash) {
  const match = hash.match(/^#\/q\/([^/]+)(?:\/page\/(\d+))?$/);
  if (!match) return null;
  return { query: decodeURIComponent(match[1]), page: Number(match[2] || 1) };
}
function searchRoute(query, page) {
  return "#/q/" + encodeURIComponent(query) + "/page/" + page;
}
function saveSearchState(state) {
  try {
    localStorage.setItem(SEARCH_STORAGE_KEY, JSON.stringify(state));
  } catch (err) {}
}
function loadSearchState() {
  try {
    return JSON.parse(localStorage.getItem(SEARCH_STORAGE_KEY));
  } catch (err) {
    return null;
  }
}
function placeholderCard(id) {
  return "<li class='card' data-search-id='" + id + "' data-busy='1' aria-busy='true'><div class='text'><a href='" + viewerLink(id) + "'" + targetAttr() + ">#" + id + "</a>" + badgeRow(id) + "<span class='meta'>読み込み中</span></div></li>";
}
function restoreSearchState() {
  const state = loadSearchState();
  const filter = (state && state.filter) || loadFilterState();
  const rawQuery = String((state && (state.rawQuery || state.query)) || "");
  if (rawQuery) {
    const queryInput = document.getElementById("query");
    const langInput = document.getElementById("lang");
    const pageInput = document.getElementById("page");
    const status = document.getElementById("search-status");
    const results = document.getElementById("results");
    const count = document.getElementById("count");
    queryInput.value = rawQuery;
    if (langInput && state.lang) langInput.value = state.lang;
    if (pageInput) pageInput.value = String(state.page || 1);
    const ids = Array.isArray(state.ids) ? state.ids : [];
    currentSearchTotal = Number(state.total || 0);
    renderSearchPageStatus();
    if (count) count.textContent = (state.total || 0) + " 件・ページ " + (state.page || 1);
    setStatus(status, "検索結果復元: " + rawQuery);
    results.innerHTML = ids.map((id) => placeholderCard(id)).join("") || "<li>0 件</li>";
  }
  restoreFilterControls(filter);
  if (!rawQuery) return;
}
function searchTotalPages(total) {
  return Math.max(1, Math.ceil(Number(total || 0) / 25));
}

function recordPerfCache(value) {
  if (!value) return;
  perfStatus.cacheDistribution[value] = (perfStatus.cacheDistribution[value] || 0) + 1;
}

function renderPerfStatus() {
  const el = document.getElementById("perf-status");
  if (!el) return;
  if (!perfStatus.searchMs && !perfStatus.cardsLoaded) {
    el.textContent = "";
    return;
  }
  const cacheText = Object.keys(perfStatus.cacheDistribution).length ? "・キャッシュ " + Object.keys(perfStatus.cacheDistribution).map((k) => k + "=" + perfStatus.cacheDistribution[k]).join(" ") : "";
  el.textContent = "計測: /api/search " + Math.round(perfStatus.searchMs) + "ms" + (perfStatus.serverTiming ? "・サーバー " + perfStatus.serverTiming : "") + "・カード " + perfStatus.cardsLoaded + " " + Math.round(perfStatus.cardTotalMs) + "ms" + cacheText;
}
function renderSearchPageStatus() {
  const status = document.getElementById("search-page-status");
  if (!status) return;
  const page = Number(document.getElementById("page").value || "1");
  const total = Number(currentSearchTotal || 0);
  const totalPages = searchTotalPages(total);
  const prev = document.getElementById("search-prev");
  const next = document.getElementById("search-next");
  if (prev) prev.disabled = page <= 1;
  if (next) next.disabled = total > 0 && page >= totalPages;
  status.textContent = "ページ " + page + " / " + (total ? totalPages : "-") + "・合計 " + total;
}
async function setSearchPage(delta) {
  const total = Number(currentSearchTotal || 0);
  const totalPages = searchTotalPages(total);
  const page = Number(document.getElementById("page").value || "1");
  const target = page + delta;
  if (!total || target < 1 || target > totalPages) return;
  document.getElementById("page").value = String(target);
  await runSearch();
}
function placeholderElement(results, id) {
  return results.querySelector("[data-search-id='" + id + "']");
}

const FILTER_STORAGE_KEY = "hitomi_hub_search_filters";
const TYPE_FILTER_OPTIONS = ["manga", "doujinshi", "manhua", "manhwa", "other"];
let lastSearchQuery = "";

function filterSeriesTerm(value) {
  return String(value || "").trim().replace(/\s+/g, "_");
}

function composeFilterGroup(series, types) {
  const terms = [];
  const seriesTerm = filterSeriesTerm(series);
  if (seriesTerm) terms.push("series:" + seriesTerm);
  const selected = Array.isArray(types) ? types.filter(Boolean) : [];
  if (selected.length > 1) terms.push(selected.map((t) => "type:" + t).join(" or "));
  else if (selected.length === 1) terms.push("type:" + selected[0]);
  return terms.join(" ");
}

function composeEffectiveQuery(rawQuery, series, types) {
  const base = String(rawQuery || "").trim();
  const filterGroup = composeFilterGroup(series, types);
  if (!filterGroup) return base;
  if (!base) return filterGroup;
  return base + " and " + filterGroup;
}

function currentFilterState() {
  const seriesInput = document.getElementById("series-filter");
  const types = [];
  for (const v of TYPE_FILTER_OPTIONS) {
    const cb = document.getElementById("type-filter-" + v);
    if (cb && cb.checked) types.push(v);
  }
  return { series: String((seriesInput && seriesInput.value) || ""), types };
}

function loadFilterState() {
  if (typeof localStorage === "undefined") return null;
  try {
    const raw = localStorage.getItem(FILTER_STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (err) {
    return null;
  }
}

function saveFilterState(filter) {
  if (typeof localStorage === "undefined") return;
  try {
    localStorage.setItem(FILTER_STORAGE_KEY, JSON.stringify(filter));
  } catch (err) {
    // localStorage is best-effort for local restore only.
  }
}

function restoreFilterControls(filter) {
  const seriesInput = document.getElementById("series-filter");
  if (seriesInput) seriesInput.value = String((filter && filter.series) || "");
  const types = Array.isArray(filter && filter.types) ? filter.types : [];
  for (const v of TYPE_FILTER_OPTIONS) {
    const cb = document.getElementById("type-filter-" + v);
    if (cb) cb.checked = types.includes(v);
  }
}

// jump-to-first-status-page highlight (decision 2026-11-05 design approved). The card height contract is unchanged.
function highlightCard(id) {
  const results = document.getElementById("results");
  if (!results) return;
  const el = placeholderElement(results, id);
  if (!el) return;
  el.classList.add("highlight");
  el.scrollIntoView({ block: "center" });
}

function distanceToVisibleArea(id, visibleIds, results, visibleRoot) {
  if (visibleIds.has(id)) return 0;
  const el = placeholderElement(results, id);
  if (!el) return Number.MAX_SAFE_INTEGER;
  const elRect = el.getBoundingClientRect();
  const rootRect = visibleRoot.getBoundingClientRect();
  if (elRect.bottom <= rootRect.top) return rootRect.top - elRect.bottom;
  if (elRect.top >= rootRect.bottom) return elRect.top - rootRect.bottom;
  return 0;
}

function takeNextSearchCard(pending, visibleIds, results, visibleRoot) {
  for (const id of pending) {
    if (visibleIds.has(id)) return id;
  }
  let best = null;
  let bestDistance = Infinity;
  for (const id of pending) {
    const distance = distanceToVisibleArea(id, visibleIds, results, visibleRoot);
    if (distance < bestDistance) {
      bestDistance = distance;
      best = id;
    }
  }
  return best === null ? pending[0] : best;
}

async function loadSearchCards(ids, searchGen = searchGeneration) {
  const status = document.getElementById("search-status");
  const results = document.getElementById("results");
  const pending = ids.slice();
  const visibleIds = new Set();
  const visibleRoot = results.parentElement || document.documentElement;
  let processed = 0;
  let eagerCoverCount = 0;

  const observer = new IntersectionObserver((entries) => {
    if (searchGen !== searchGeneration) return;
    for (const entry of entries) {
      const id = Number(entry.target.dataset.searchId);
      if (!pending.includes(id)) continue;
      if (entry.isIntersecting) visibleIds.add(id);
      else visibleIds.delete(id);
    }
  }, { root: visibleRoot });
  for (const id of pending) {
    const el = placeholderElement(results, id);
    if (el) observer.observe(el);
  }

  async function processCard(id) {
    if (searchGen !== searchGeneration) return;
    setStatus(status, "カード読み込み " + processed + "/" + ids.length + ": " + id);
    const li = results.querySelector("[data-search-id='" + id + "']");
    const cardStart = performance.now();
    try {
      const card = await api("/api/search-card/" + id);
      if (searchGen !== searchGeneration) return;
      perfStatus.cardsLoaded++;
      perfStatus.cardTotalMs += performance.now() - cardStart;
      recordPerfCache(card._x_cache);
      renderPerfStatus();
      completeCardState(card);
      if (li) {
        const isCurrentlyVisible = visibleIds.has(id) || distanceToVisibleArea(id, visibleIds, results, visibleRoot) === 0;
        const highPriority = eagerCoverCount < FIRST_VISIBLE_EAGER_COVER_COUNT && isCurrentlyVisible;
        if (highPriority) eagerCoverCount++;
        li.outerHTML = renderSearchCard(card, { highPriority });
        await loadSearchCardCover(card, searchGen, highPriority);
      }
    } catch (err) {
      if (searchGen !== searchGeneration) return;
      perfStatus.cardsLoaded++;
      perfStatus.cardTotalMs += performance.now() - cardStart;
      renderPerfStatus();
      if (li) li.innerHTML = "<span class='meta'>" + escapeHTML(err.message) + "</span>";
    }
    processed++;
  }

  async function worker() {
    while (pending.length && searchGen === searchGeneration) {
      const id = takeNextSearchCard(pending, visibleIds, results, visibleRoot);
      pending.splice(pending.indexOf(id), 1);
      await processCard(id);
    }
  }

  const workers = [];
  const workerCount = Math.min(SEARCH_CARD_CONCURRENCY, ids.length);
  for (let i = 0; i < workerCount; i++) workers.push(worker());
  await Promise.all(workers);
  observer.disconnect();
}

function debounceLists() {
  return new Promise((resolve) => {
    listsWaiters.push(resolve);
    if (listsDebounceTimer) clearTimeout(listsDebounceTimer);
    listsDebounceTimer = setTimeout(() => {
      listsDebounceTimer = null;
      const waiters = listsWaiters;
      listsWaiters = [];
      for (const resolve of waiters) resolve();
    }, readListsDebounceMs);
  });
}

function completeCardState(card) {
  const id = Number(card.id);
  const s = card.read_state || {};
  const state = readStateByGallery.get(id) || { last_page: 0, fully_read: 0, viewed: 0 };
  state.last_page = s.last_page || state.last_page || 1;
  if (s.viewed) state.viewed = 1;
  if (s.fully_read) state.fully_read = 1;
  readStateByGallery.set(id, state);
  if (card.saved) savedByGallery.set(id, 1);
  if (s.favorite) favoriteByGallery.set(id, 1);
}

function mergeReadState(id, row) {
  const state = readStateByGallery.get(id) || { last_page: 0, fully_read: 0, viewed: 0 };
  state.last_page = row.last_page || state.last_page || 1;
  if (row.fully_read) state.fully_read = 1;
  if (row.viewed) state.viewed = 1;
  return state;
}

function renderReadBadges() {
  const results = document.getElementById("results");
  if (!results) return;
  for (const li of results.querySelectorAll("li[data-search-id]")) {
    const id = Number(li.dataset.searchId);
    li.classList.toggle("has-status", hasStatus(id));
    const badge = li.querySelector(".badge");
    if (!badge) continue;
    badge.innerHTML = badgeInner(id);
  }
}

async function showLists(searchGen) {
  if (searchGen !== undefined && searchGen !== searchGeneration) return;
  await debounceLists();
  if (searchGen !== undefined && searchGen !== searchGeneration) return;
  let pending = listsFetchPending;
  if (!pending) {
    pending = api("/api/lists").then((data) => { if (listsFetchPending === pending) listsFetchPending = null; return data; }, (err) => { if (listsFetchPending === pending) listsFetchPending = null; throw err; });
    listsFetchPending = pending;
  }
  const lists = await pending;
  if (searchGen !== undefined && searchGen !== searchGeneration) return;
  // card 応答の state で maps を補完する（clear しない。viewed / saved は card 由来）。
  for (const row of lists.favorites) {
    const id = Number(row.gallery_id);
    favoriteByGallery.set(id, 1);
    readStateByGallery.set(id, mergeReadState(id, row));
  }
  for (const row of lists.unread) {
    const id = Number(row.gallery_id);
    readStateByGallery.set(id, mergeReadState(id, row));
  }
  document.getElementById("queries").innerHTML = lists.queries.map((q) =>
    "<li><a href='#/q/" + encodeURIComponent(q.query) + "'" + targetAttr() + ">" + escapeHTML(q.name) + "</a> <span class='meta'>" + escapeHTML(q.query) + "</span></li>").join("") || "<li>なし</li>";
  document.getElementById("favorites").innerHTML = lists.favorites.map((row) =>
    "<li><a href='" + viewerLink(row.gallery_id, row.last_page || 1) + "'" + targetAttr() + ">" + escapeHTML(row.gallery_id) + "</a> <span class='meta'>p" + row.last_page + (row.fully_read ? " 既読" : "") + "</span></li>").join("") || "<li>なし</li>";
  document.getElementById("unread").innerHTML = lists.unread.map((row) =>
    "<li><a href='" + viewerLink(row.gallery_id, row.last_page || 1) + "'" + targetAttr() + ">" + escapeHTML(row.gallery_id) + "</a> <span class='meta'>p" + row.last_page + "</span></li>").join("") || "<li>なし</li>";
  renderReadBadges();
}

async function runSearch() {
  searchCardsCompleted = false;
  const rawQuery = document.getElementById("query").value.trim();
  const filter = currentFilterState();
  const query = composeEffectiveQuery(rawQuery, filter.series, filter.types);
  lastSearchQuery = query;
  const lang = document.getElementById("lang").value.trim() || "all";
  const page = Number(document.getElementById("page").value || "1");
  const searchGen = ++searchGeneration;
  const status = document.getElementById("search-status");
  const results = document.getElementById("results");
  const submit = document.getElementById("search-submit");
  const originalText = submit.dataset.original || submit.textContent;
  submit.dataset.original = originalText;
  setStatus(status, "検索実行中: " + query);
  submit.disabled = true;
  submit.textContent = "実行中…";
  results.innerHTML = "<li class='meta'>検索実行中…</li>";
  const searchStart = performance.now();
  try {
    const data = await api("/api/search?query=" + encodeURIComponent(query) + "&lang=" + encodeURIComponent(lang) + "&page=" + page + "&limit=25");
    if (searchGen !== searchGeneration) return;
    perfStatus.searchMs = performance.now() - searchStart;
    perfStatus.serverTiming = data._x_search_timing || "";
    recordPerfCache(data._x_cache);
    renderPerfStatus();
    const ids = data.ids || (data.results || []).map((r) => r.id);
    currentSearchTotal = Number(data.total || 0);
    renderSearchPageStatus();
    document.getElementById("count").textContent = data.total + " 件・ページ " + data.page;
    setStatus(status, "検索完了・カード読み込み " + ids.length + "件");
    results.innerHTML = ids.map((id) => placeholderCard(id)).join("") || "<li>0 件</li>";
    saveSearchState({ query, rawQuery, lang, page, ids, total: data.total, filter });
    saveFilterState(filter);
    history.replaceState(null, "", searchRoute(query, page));
    await loadSearchCards(ids, searchGen);
    if (searchGen !== searchGeneration) return;
    searchCardsCompleted = true;
    armPrefetchIdle();
    await showLists(searchGen);
    if (pendingHighlightId && ids.includes(pendingHighlightId)) {
      highlightCard(pendingHighlightId);
      pendingHighlightId = null;
    }
    setStatus(status, "検索完了・カード表示済み " + ids.length + "件");
  } catch (err) {
    if (searchGen !== searchGeneration) return;
    setStatus(status, "検索エラー: " + err.message, true);
  } finally {
    if (searchGen === searchGeneration) {
      submit.disabled = false;
      submit.textContent = originalText;
    }
  }
}

function applyPrefetchCardKnowledge(card, gen) {
  if (gen !== searchGeneration) return;
  if (!card || card.error) return;
  setSearchTitleGroup(card);

  const key = normalizeTitleKey(card);
  const group = titleGroups.get(key);
  if (!key || !group || card.language === "japanese" || group.language !== "japanese" || Number(group.bestId) === Number(card.id)) return;

  const results = document.getElementById("results");
  if (!results) return;
  const li = results.querySelector("li[data-search-id=\"" + Number(card.id) + "\"]");
  if (!li) return;

  const text = li.querySelector(".text");
  if (!text) return;
  if (text.querySelector(".same-title-anchor")) return;

  const div = document.createElement("div");
  div.className = "meta same-title-anchor";
  div.appendChild(document.createTextNode("同名の日本語版: "));

  const link = document.createElement("a");
  link.href = viewerLink(group.bestId);
  if (newTabMode) link.target = "_blank";
  link.textContent = "#" + group.bestId;

  div.appendChild(link);
  text.appendChild(div);
}

const PREFETCH_IDLE_MS = 800;
const PREFETCH_CONCURRENCY = 4;
const PREFETCH_COOLDOWN_MS = 300000;
const PREFETCH_AHEAD_PAGES = 2;
let prefetchCooldownUntil = 0;
let prefetchInterruptFlag = false;
let prefetchEligible = true;
let searchCardsCompleted = false;
let prefetchIdleTimer = null;
let prefetchRunning = false;

function prefetchMarkerUrl(path) {
  return path + (path.indexOf("?") >= 0 ? "&" : "?") + "priority=background";
}

function handlePrefetchFailure(err) {
  const status = Number(err && err.status) || 0;
  if (status === 429 || status >= 500) {
    prefetchCooldownUntil = Date.now() + PREFETCH_COOLDOWN_MS;
  }
  prefetchInterruptFlag = true;
}

function prefetchInterrupted(gen) {
  return prefetchInterruptFlag || gen !== searchGeneration || Date.now() < prefetchCooldownUntil;
}

function interruptPrefetch() {
  prefetchInterruptFlag = true;
}

function startPrefetchNow() {
  if (!prefetchEligible || !searchCardsCompleted) return;
  return runPrefetch();
}

function armPrefetchIdle() {
  prefetchInterruptFlag = false;
  if (prefetchIdleTimer) clearTimeout(prefetchIdleTimer);
  prefetchIdleTimer = setTimeout(() => {
    prefetchIdleTimer = null;
    startPrefetchNow();
  }, PREFETCH_IDLE_MS);
}

async function prefetchQueue(jobs, gen, onCard) {
  const pending = jobs.slice();
  async function worker() {
    while (pending.length && !prefetchInterrupted(gen)) {
      const job = pending.shift();
      let card;
      try {
        card = await api(prefetchMarkerUrl(job));
      } catch (err) {
        handlePrefetchFailure(err);
        return;
      }
      if (prefetchInterrupted(gen)) return;
      if (onCard) onCard(card);
    }
  }
  const workers = [];
  const workerCount = Math.min(PREFETCH_CONCURRENCY, pending.length);
  for (let i = 0; i < workerCount; i++) workers.push(worker());
  await Promise.all(workers);
}

async function runPrefetch() {
  const gen = searchGeneration;
  if (prefetchRunning || prefetchInterrupted(gen) || !prefetchEligible) return;
  const query = typeof lastSearchQuery !== "undefined" && lastSearchQuery ? lastSearchQuery : document.getElementById("query").value.trim();
  const lang = document.getElementById("lang").value.trim() || "all";
  const currentPage = Number(document.getElementById("page").value || "1");
  const total = Number(currentSearchTotal || 0);
  const maxAheadPage = Math.min(currentPage + PREFETCH_AHEAD_PAGES, searchTotalPages(total));
  if (!total || currentPage + 1 > maxAheadPage) return;
  prefetchRunning = true;
  try {
    for (let offset = 1; offset <= PREFETCH_AHEAD_PAGES; offset++) {
      const page = currentPage + offset;
      if (page > maxAheadPage) break;
      if (prefetchInterrupted(gen)) return;
      const data = await api(prefetchMarkerUrl("/api/search?query=" + encodeURIComponent(query) + "&lang=" + encodeURIComponent(lang) + "&page=" + page + "&limit=25"));
      if (prefetchInterrupted(gen)) return;
      const ids = data.ids || (data.results || []).map((r) => r.id);
      if (!ids.length) continue;
      const cards = [];
      await prefetchQueue(ids.map((id) => "/api/search-card/" + id), gen, (card) => {
        cards.push(card);
        applyPrefetchCardKnowledge(card, gen);
      });
      if (prefetchInterrupted(gen)) return;
      await prefetchQueue(cards.map((card) => searchCardCoverSource(card)).filter(Boolean), gen);
    }
  } catch (err) {
    handlePrefetchFailure(err);
    return;
  } finally {
    prefetchRunning = false;
  }
}

document.getElementById("search").addEventListener("submit", (e) => { e.preventDefault(); runSearch(); });
document.getElementById("search").addEventListener("submit", () => { prefetchEligible = true; });
document.getElementById("search-prev").addEventListener("click", (e) => { e.preventDefault(); setSearchPage(-1); });
document.getElementById("search-next").addEventListener("click", (e) => { e.preventDefault(); setSearchPage(1); });
document.getElementById("saved-search").addEventListener("submit", async (e) => {
  e.preventDefault();
  const name = document.getElementById("qname").value.trim();
  const text = document.getElementById("qtext").value.trim();
  if (!name || !text) return;
  try { await post("/api/query", { name, query: text }); await showLists(); }
  catch (err) { setStatus(document.getElementById("search-status"), "保存検索エラー: " + err.message, true); }
});
document.getElementById("lists-refresh").addEventListener("click", () => { showLists(); });

// Phase 2 idle prefetch wiring: user activity that supersedes the next-page prefetch interrupts it. Failures are never rendered on screen.
document.getElementById("query").addEventListener("input", () => { interruptPrefetch(); });
document.getElementById("series-filter").addEventListener("input", () => { interruptPrefetch(); });
for (const v of TYPE_FILTER_OPTIONS) document.getElementById("type-filter-" + v).addEventListener("input", () => { interruptPrefetch(); });
document.getElementById("search-next").addEventListener("mouseenter", () => { startPrefetchNow(); });
document.getElementById("search-next").addEventListener("focus", () => { startPrefetchNow(); });
document.getElementById("results").addEventListener("click", (e) => {
  if (e.target.closest("a")) interruptPrefetch();
});
// Manual Japanese search button click (foreground data request only: /api/search exact term +
// /api/search-card/<id>). No TN request, no saved query change, no whole-card re-render.
document.getElementById("results").addEventListener("click", (e) => { handleManualJapaneseSearchClick(e); });
document.getElementById("results").addEventListener("click", async (e) => {
  const btn = e.target.closest("button[data-reset]");
  if (!btn) return;
  const li = e.target.closest("li[data-search-id]");
  if (!li) return;
  const id = Number(li.dataset.searchId);
  try {
    const row = await post("/api/reset", { gallery_id: id, target: btn.dataset.reset });
    readStateByGallery.set(id, { last_page: row.last_page || 0, fully_read: row.fully_read || 0, viewed: row.viewed || 0 });
    if (row.favorite) favoriteByGallery.set(id, 1);
    else favoriteByGallery.delete(id);
    renderReadBadges();
    setStatus(document.getElementById("search-status"), "リセット: #" + id + " " + btn.dataset.reset);
  } catch (err) {
    setStatus(document.getElementById("search-status"), "リセットエラー: " + err.message, true);
  }
});
document.addEventListener("visibilitychange", () => {
  if (document.hidden) interruptPrefetch();
});

// jump-to-first-status-page (decision 2026-11-05): status checkboxes default = any (all 4).
// Click is a user-originated foreground request: interrupt the running prefetch first. The route
// change goes through the existing hashchange → runSearch path (route-derived prefetchEligible=false).
const STATUS_FLAG_NAMES = { viewed: "表示済み", read: "既読", saved: "保存済み", favorite: "お気に入り" };
function checkedStatusNames() {
  const names = [];
  for (const cb of document.querySelectorAll("#search input[data-status-filter]")) {
    if (cb.checked) names.push(cb.value);
  }
  return names.join(",");
}
// random order is disabled here (decision 2026-11-05-jump-first-status-page-random-order-disabled).
function queryHasRandomOrder(query) {
  for (const raw of String(query || "").split(/\s+/)) {
    const term = raw.toLowerCase().replace(/_/g, " ");
    if (term === "orderby:random" || term === "sortby:random") return true;
  }
  return false;
}
function updateJumpButton() {
  const jump = document.getElementById("jump-first-status");
  if (jump) jump.disabled = queryHasRandomOrder(document.getElementById("query").value);
}
function flagNamesText(flags) {
  return Object.keys(STATUS_FLAG_NAMES).filter((k) => Number(flags && flags[k]) === 1).map((k) => STATUS_FLAG_NAMES[k]).join(" ");
}
document.getElementById("query").addEventListener("input", updateJumpButton);
document.getElementById("jump-first-status").addEventListener("click", async () => {
  const jump = document.getElementById("jump-first-status");
  if (jump.disabled) return;
  interruptPrefetch();
  const status = document.getElementById("search-status");
  const query = document.getElementById("query").value.trim();
  const lang = document.getElementById("lang").value.trim() || "all";
  const currentPage = Number(document.getElementById("page").value || "1");
  try {
    const data = await api("/api/search-first-status?query=" + encodeURIComponent(query) + "&lang=" + encodeURIComponent(lang) + "&status=" + encodeURIComponent(checkedStatusNames()));
    const hit = data.hit;
    if (!hit) {
      setStatus(status, "該当なし");
      return;
    }
    const target = Number(hit.page || 1);
    const flagText = flagNamesText(hit.flags);
    setStatus(status, "ジャンプ: ページ " + target + "・順位 " + hit.rank + "・#" + hit.gallery_id + (flagText ? "・" + flagText : ""));
    if (target === currentPage) {
      highlightCard(hit.gallery_id);
      return;
    }
    pendingHighlightId = hit.gallery_id;
    const route = searchRoute(query, target);
    if (window.location.hash === route) {
      await runSearch();
    } else {
      window.location.hash = route;
    }
  } catch (err) {
    setStatus(status, "ジャンプエラー: " + err.message, true);
  }
});

window.addEventListener("hashchange", async () => {
  const search = parseSearchHash(window.location.hash);
  if (search) {
    // saved-query and routed searches must not trigger the idle prefetch; form search re-enables it
    prefetchEligible = false;
    document.getElementById("query").value = search.query;
    document.getElementById("page").value = String(search.page);
    renderSearchPageStatus();
    await runSearch();
  }
});

loadTitleGroups();
showLists();
const initialSearch = parseSearchHash(window.location.hash);
if (initialSearch) {
  restoreSearchState();
  document.getElementById("query").value = initialSearch.query;
  document.getElementById("page").value = String(initialSearch.page);
  renderSearchPageStatus();
  runSearch();
} else {
  restoreSearchState();
  runSearch();
}
