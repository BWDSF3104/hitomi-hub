<!DOCTYPE html>
<html lang="ja">
<head>

<style>

  body { font-family: var(--font-ui); margin: var(--space-4); background: var(--bg); color: var(--text); height: calc(100vh - var(--space-4) * 2); overflow: hidden; display: flex; flex-direction: column; }
  h1 { font-size: 1.1rem; margin: 0 0 var(--space-3); }
  nav { font-size: .9rem; margin-bottom: var(--space-2); }
  .cols { display: flex; gap: 1rem; align-items: flex-start; flex: 1; min-height: 0; }
  .main { flex: 1; min-width: 20rem; height: 100%; min-height: 0; overflow-y: auto; }
  .main { scroll-padding-top: 44px; }
  #nav { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: var(--space-2) 0; }
  @media (prefers-reduced-motion: no-preference) { .main { scroll-behavior: smooth; } }
  section { margin-bottom: var(--space-4); }
  h2 { font-size: .95rem; margin: 0 0 var(--space-2); color: var(--muted); }
  form { display: flex; gap: var(--space-2); flex-wrap: wrap; align-items: center; }
  input { padding: var(--space-1) var(--space-2); min-height: var(--tap-min); background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius); font: inherit; }
  button { padding: var(--space-1) var(--space-3); min-height: var(--tap-min); background: var(--button); color: var(--text); border: 0; border-radius: var(--radius); cursor: pointer; font: inherit; transition: background var(--speed-fast) ease, box-shadow var(--speed-fast) ease; }
  button:hover { background: var(--button-hover); }
  button:active { background: var(--button-active); box-shadow: 0 1px 3px rgba(0, 0, 0, .35); }
  input:focus-visible, button:focus-visible, select:focus-visible, a:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: .3rem 0; border-bottom: 1px solid var(--border-soft); }
  a { color: var(--link); text-decoration: none; }
  .meta { font-size: .9rem; color: var(--muted); }
  .error { font-size: .85rem; color: #f0a441; }
  .status { font-size: .85rem; color: var(--focus); margin-bottom: .4rem; }
  .strip img { object-fit: cover; background: var(--surface); }
  .strip { margin-top: var(--space-1); }
  .strip { display: flex; gap: .3rem; flex-wrap: wrap; }
  .strip img { width: 90px; height: 90px; }
  .strip .strip-loading {
    width: 90px;
    height: 90px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: .8rem;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--radius);
    animation: ui-pulse 1.2s ease-in-out infinite;
  }
  @keyframes ui-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .7; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
  .strip a { position: relative; }
  .badge { position: absolute; right: 4px; top: 4px; background: var(--focus); color: var(--bg); padding: 2px 5px; border-radius: 4px; font-size: .8rem; }
  .current { border: 2px solid var(--focus); }
  .pageimg { max-width: 100%; max-height: 78vh; background: var(--surface); object-fit: contain; }
  .reader .reader-loading {
    grid-column: 1 / -1;
    display: flex;
    gap: var(--space-2);
    align-items: center;
    padding: var(--space-2);
    background: var(--surface);
    border: 1px solid var(--border);
    min-height: var(--reader-page-height);
    color: var(--muted);
    border-radius: var(--radius);
    animation: ui-pulse 1.2s ease-in-out infinite;
  }
  .reader-loading img { max-width: 180px; max-height: 180px; object-fit: contain; background: var(--bg); }
  .reader-loading-text { color: var(--focus); font-size: .9rem; }
  .reader {
    --reader-page-width: min(45vw, 500px);
    --reader-page-height: min(78vh, 700px);
    display: grid;
    gap: 0;
    grid-template-columns: repeat(2, minmax(0, var(--reader-page-width)));
  }
  .reader.double { grid-template-columns: repeat(2, minmax(0, var(--reader-page-width))); }
  .reader:not(.double) { grid-template-columns: minmax(0, var(--reader-page-width)); }
  .reader.landscape { --reader-page-width: min(92vw, calc(var(--reader-page-height) * 1.6)); grid-template-columns: minmax(0, var(--reader-page-width)); }
  .reader img {
    display: block;
    width: min(var(--reader-page-width), 100%);
    height: var(--reader-page-height);
    background: var(--surface);
    object-fit: contain;
  }
  /* aspect 追従: 単一ページ表示では画像実測アスペクトで高さを縮める（枠高さは上限） */
  .reader:not(.double) img { height: auto; max-height: var(--reader-page-height); }
  html.fullscreen h1, body.fullscreen h1, html.fullscreen nav.page-nav, body.fullscreen nav.page-nav, body.pseudo-fullscreen nav.page-nav, html.fullscreen #reader-controls, body.fullscreen #reader-controls, body.pseudo-fullscreen #reader-controls, html.fullscreen .meta, body.fullscreen .meta, body.pseudo-fullscreen .meta, html.fullscreen section h2, body.fullscreen section h2, body.pseudo-fullscreen section h2 { display: none; }
  html.fullscreen .reader, body.fullscreen .reader, body.pseudo-fullscreen .reader {
    --fullscreen-page-padding: 12px;
    --fullscreen-page-height: calc(100vh - var(--fullscreen-page-padding) * 2);
    --fullscreen-page-width: calc(100vw - var(--fullscreen-page-padding) * 2);
    box-sizing: border-box; position: fixed; inset: 0; z-index: 10; margin: 0; width: 100%; height: 100%; padding: var(--fullscreen-page-padding); background: #111; gap: 0; grid-template-columns: minmax(0, var(--fullscreen-page-width));
  }
  html.fullscreen .reader.double, body.fullscreen .reader.double, body.pseudo-fullscreen .reader.double {
    grid-template-columns: repeat(2, minmax(0, calc(var(--fullscreen-page-width) / 2)));
  }
  html.fullscreen .reader img, body.fullscreen .reader img, body.pseudo-fullscreen .reader img {
    display: block; width: 100%; height: var(--fullscreen-page-height); background: #1d2126; object-fit: contain;
  }
  html.fullscreen .reader.double img:nth-child(1), body.fullscreen .reader.double img:nth-child(1), body.pseudo-fullscreen .reader.double img:nth-child(1) { object-position: right center; }
  html.fullscreen .reader.double img:nth-child(2), body.fullscreen .reader.double img:nth-child(2), body.pseudo-fullscreen .reader.double img:nth-child(2) { object-position: left center; }
</style>
</head>
<body>
<h1>hitomi hub viewer（閲覧ページ）</h1>
<nav class="page-nav"><a href="/search">検索</a></nav>
<div class="cols">
  <div class="main">
    <section>
      <h2>閲覧</h2>
      <div id="gallery" class="meta">ギャラリー情報（検索ページからギャラリーを選ぶ）</div>
      <div id="reader-controls" class="meta">
        <div id="view-mode-buttons" class="meta" role="group" aria-label="表示モード">
          <button type="button" data-mode="single" aria-pressed="false">単一</button>
          <button type="button" data-mode="double" aria-pressed="false">見開き</button>
          <button type="button" data-mode="fullscreen" aria-pressed="false">全画面</button>
          <button type="button" id="spread-direction" data-direction="rtl" aria-pressed="true" aria-label="開き方向">右→左</button>
        </div>
        <span class="meta">キーボード: ← / → / d=見開き / s=単一 / f=全画面</span>
        <div id="view-state" class="meta" role="status"></div>
      </div>
      <div id="acquisition-controls" class="meta">
        <button type="button" id="acquisition-start">取得</button>
        <button type="button" id="acquisition-abort">中止</button>
        <span id="acquisition-status" class="status" role="status" aria-live="polite"></span>
      </div>
      <div id="acquisition-results" class="meta"></div>
      <div id="reader-position" class="meta" role="status"></div>
      <div id="prefetch-status" class="status" role="status" aria-live="polite"></div>
      <div id="retry-controls" class="meta"><button id="retry-failed" type="button" disabled>失敗を再試行</button></div>
      <div id="reader" class="reader double"></div>
      <form id="nav">
        <button id="prev" type="button">前</button>
        <input id="pagenum" size="4" inputmode="numeric" aria-label="ページ">
        <button id="next" type="button">次</button>
        <button id="complete" type="button">読み完了</button>
        <button id="fav" type="button">お気に入り</button>
      </form>
      <div class="meta">キーボード: ← / → でページ送り。通常サイズでは見開き。</div>
      <div id="strip-controls" class="meta">
        <button id="strip-prev-group">前のグループ</button>
        <input id="strip-group" size="4" placeholder="グループ" inputmode="numeric" aria-label="グループ番号">
        <button id="strip-go-group">移動</button>
        <button id="strip-next-group">次のグループ</button>
        <span id="strip-group-status" class="meta" role="status">グループ -</span>
      </div>
      <div class="strip" id="thumbs"></div>
    </section>
  </div>
</div>
<script>
const api = (p) => fetch(p, { cache: "no-store" }).then(async (r) => {
  const data = await r.json().catch(() => ({}));
  data._x_cache = r.headers.get("x-cache") || null;
  if (!r.ok) throw new Error(data.error || (r.status + " " + p));
  return data;
});
const post = (p, body) => fetch(p, { method: "POST", headers: { "content-type": "application/json" },
  body: JSON.stringify(body) }).then(async (r) => {
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || (r.status + " " + p));
  return data;
});

const newTabMode = new URLSearchParams(window.location.search).get("newtab") === "1";
let current = { id: 0, page: 1, count: 0, favorite: 0, files: [] };
let viewMode = "double";
let lastViewMode = "double";
let fullscreenState = "off";
let currentPairEnd = null;
let displaySource = "";
let stripGroup = null;
let stripRenderedGallery = null;
let stripRenderedGroup = null;
let prefetchAbort = null;
let backgroundSignal = null;
let backgroundGalleryId = null;
const prefetchQueue = [];
const prefetchQueueKeys = new Set();
let fullDone = 0;
let tnDone = 0;
let errorDone = 0;
let prefetchTotal = 0;
const PREFETCH_CONCURRENCY = 8;
let MAX_FULL_CACHE_ENTRIES = 4000;
let fullObjectUrls = new Set();
const fullObjectUrlLru = new Map();
const currentDisplayObjectUrlKeys = new Set();
const currentGalleryObjectUrlKeys = new Set();
const fullCache = new Map();
const prefetchedEntries = new Map();
const countsByGallery = new Map();
const displayPassByEntry = new Map();
const sourceStatusByEntry = new Map();
const sourceTypeByEntry = new Map();
const activeObjectUrlKeys = new Set();
const manualRetryingKeys = new Set();
let manualRetryRunning = false;
const galleryCache = new Map();
let spreadDirection = "rtl";
const SPREAD_DIRECTION_STORAGE_KEY = "hitomi_hub_spread_direction";
let openGeneration = 0;
let showGeneration = 0;
let renderGeneration = 0;
let currentPriorityDone = Promise.resolve();

function escapeHTML(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}
// URL path 段は percent encode で属性境界を保存する（encodeURIComponent は ' を変換しないため明示的に %27 へ）
function encodePathSegment(s) {
  return encodeURIComponent(String(s ?? "")).replace(/'/g, "%27");
}
function targetAttr() {
  return newTabMode ? " target='_blank'" : "";
}
function newTabHref(hash) {
  return newTabMode ? window.location.pathname + window.location.search + hash : hash;
}
function route(id, page, second) {
  if (second) return "#/g/" + id + "/page/" + page + "-" + second;
  return "#/g/" + id + "/page/" + page;
}
function setRoute(id, page) {
  const items = readerItems();
  const second = doubleActive() && items.length > 1 ? items[1].page : null;
  history.replaceState(null, "", route(id, page, second));
}
function updateTabTitle(title) {
  const display = title || current.id;
  if (!display) return;
  document.title = String(display) + " - hitomi hub viewer";
}

function setGalleryMeta(data) {
  const g = data.gallery, s = data.read_state;
  const sceneIndexes = g.scene_indexes || [];
  const count = g.files.length;
  current = {
    id: g.id, page: current.page || s.last_page || 1, count, favorite: s.favorite, files: g.files,
    sceneIndexes, format: data.format || "webp"
  };
  galleryFormats.set(g.id, data.format || "webp");
  displayCountsByGallery.clear();
  document.getElementById("gallery").innerHTML =
    "<b>" + escapeHTML(g.title || current.id) + "</b> <span class='meta'>" + escapeHTML(g.language) + " / " + escapeHTML(g.type) + "</span><br>" +
    "<span class='meta'>" + escapeHTML((g.artists || []).join(", ")) + "</span><br>" +
    "<span class='meta'>" + escapeHTML((g.tags || []).join(", ")) + "</span><br>" +
    "<span class='meta'>" + current.count + " files・local " + data.local + "（format " + escapeHTML(data.format) + "）</span>";
  document.getElementById("pagenum").value = current.page;
  renderPosition();
  renderViewState();
  updateTabTitle(g.japanese_title || g.title || current.id);
}
function fileFormatFromName(name) {
  const ext = String(name || "").split(".").pop().toLowerCase();
  if (ext === "jpeg") return "jpg";
  return ext || "webp";
}

function entryFormat(entry, galleryId = current.id) {
  return entry.hasavif ? "avif" : (galleryFormats.get(galleryId) || current.format || "webp");
}
const galleryFormats = new Map();
function fullCacheKey(entry, galleryId = current.id) {
  return galleryId + "|" + entry.hash + "|" + entryFormat(entry, galleryId);
}
function cachedFullSrc(entry, galleryId = current.id) {
  const key = fullCacheKey(entry, galleryId);
  const cached = fullCache.get(key);
  if (cached && cached.objectUrl && statusIsViewerDisplaySource(sourceStatusByEntry.get(key))) return cached.objectUrl;
  return "";
}

function localDirectSrc(entry, galleryId = current.id) {
  const formats = entry.local_formats || [];
  if (!formats.length) return "";
  return "/files/" + galleryId + "/" + entry.hash + "." + formats[0];
}

function statusIsViewerDisplaySource(status) {
  return status !== "tn" && status !== "tn-cache" && status !== "no_tn" && status !== "no_full" && status !== "error";
}

function entrySourceType(entry, galleryId = current.id) {
  const key = fullCacheKey(entry, galleryId);
  if (activeObjectUrlKeys.has(key)) return "objectURL";
  if (localDirectSrc(entry, galleryId)) return "local-direct";
  return "";
}

function displayViewerSource(entry, galleryId = current.id) {
  const key = fullCacheKey(entry, galleryId);
  if (activeObjectUrlKeys.has(key)) return fullCache.get(key).objectUrl || "";
  return localDirectSrc(entry, galleryId);
}

function setSourceStatus(entry, status, galleryId = current.id) {
  const key = fullCacheKey(entry, galleryId);
  displayDelta(key, () => sourceStatusByEntry.set(key, status));
}

function setSourceTypeFromKey(key, type) {
  if (key) displayDelta(key, () => sourceTypeByEntry.set(key, type));
}

function setSourceType(entry, type, galleryId = current.id) {
  setSourceTypeFromKey(fullCacheKey(entry, galleryId), type);
}

function recordImageDisplayPassFromImg(img, galleryId = current.id) {
  if (!img || !img.dataset.key) return;
  const sourceType = img.dataset.sourceType || sourceTypeByEntry.get(img.dataset.key);
  if (!sourceType) return;
  if (img.dataset.gallery && img.dataset.gallery !== String(galleryId)) return;
  if (sourceType === "objectURL") markDisplayObjectUrlKey(img.dataset.key);
  if (img.naturalWidth > 0) {
    displayDelta(img.dataset.key, () => displayPassByEntry.set(img.dataset.key, true));
    setSourceTypeFromKey(img.dataset.key, sourceType);
    renderPrefetchStatus();
  }
}

function attachDisplayLoadHandlers(container) {
  if (!container) return;
  for (const img of container.querySelectorAll("img[data-viewer-display]")) {
    recordImageDisplayPassFromImg(img);
    img.addEventListener("load", () => recordImageDisplayPassFromImg(img));
  }
}

function markDisplayObjectUrlKey(key) {
  if (key) currentDisplayObjectUrlKeys.add(key);
}

function markGalleryObjectUrlKey(key) {
  if (key) currentGalleryObjectUrlKeys.add(key);
}

function isFullObjectUrlProtected(key) { return currentDisplayObjectUrlKeys.has(key) || currentGalleryObjectUrlKeys.has(key); }

function decrementPrefetchedCountForKey(key) {
  if (!prefetchedEntries.has(key)) return;
  const status = prefetchedEntries.get(key);
  const galleryId = Number(String(key).split("|")[0]);
  const counts = getGalleryCounts(galleryId);
  if (status === "tn" || status === "no_tn") counts.tnDone--;
  else if (status === "no_full") counts.noFullDone--;
  else if (status === "error") counts.errorDone--;
  else counts.fullDone--;
  prefetchedEntries.delete(key);
}

function revokeFullObjectUrl(key) {
  const cached = fullCache.get(key);
  if (!cached) return;
  const objectUrl = cached.objectUrl;
  if (objectUrl) {
    URL.revokeObjectURL(objectUrl);
    fullObjectUrls.delete(objectUrl);
  }
  cached.objectUrl = null;
  fullObjectUrlLru.delete(key);
  displayDelta(key, () => {
    activeObjectUrlKeys.delete(key);
    sourceStatusByEntry.delete(key);
    sourceTypeByEntry.delete(key);
  });
  decrementPrefetchedCountForKey(key);
  renderPrefetchStatus();
}

function savedStatusEvictKey(skipKey = "") {
  for (const key of fullObjectUrlLru.keys()) {
    if (!key || key === skipKey) continue;
    if (isFullObjectUrlProtected(key)) continue;
    if (sourceStatusByEntry.get(key) === "local") return key;
  }
  return null;
}

function evictFullObjectUrls(skipKey = "") {
  while (fullObjectUrls.size > MAX_FULL_CACHE_ENTRIES) {
    let evicted = false;
    const priorityKey = savedStatusEvictKey(skipKey);
    if (priorityKey) {
      revokeFullObjectUrl(priorityKey);
      evicted = true;
    } else {
      for (const key of fullObjectUrlLru.keys()) {
        if (!key || key === skipKey) continue;
        if (isFullObjectUrlProtected(key)) continue;
        revokeFullObjectUrl(key);
        evicted = true;
        break;
      }
    }
    if (!evicted) break;
  }
  renderPrefetchStatus();
}

function getGalleryCounts(galleryId) {
  if (!countsByGallery.has(galleryId)) {
    countsByGallery.set(galleryId, { fullDone: 0, tnDone: 0, noFullDone: 0, errorDone: 0, total: 0 });
  }
  return countsByGallery.get(galleryId);
}
const displayCountsByGallery = new Map();
function getDisplayCounts(galleryId) {
  if (!displayCountsByGallery.has(galleryId)) {
    displayCountsByGallery.set(galleryId, { actualPixels: 0, localDirect: 0, objectUrlCache: 0, reconciled: false });
  }
  return displayCountsByGallery.get(galleryId);
}
function keyGalleryId(key) { return Number(String(key).split("|")[0]); }
function displayContribution(key) {
  const actualPixels = displayPassByEntry.get(key) ? 1 : 0;
  const localDirect = actualPixels && sourceTypeByEntry.get(key) === "local-direct" ? 1 : 0;
  const objectUrlCache = activeObjectUrlKeys.has(key) && statusIsViewerDisplaySource(sourceStatusByEntry.get(key)) ? 1 : 0;
  return [actualPixels, localDirect, objectUrlCache];
}
function applyDisplayDelta(key, before, after) {
  const display = displayCountsByGallery.get(keyGalleryId(key));
  if (!display || !display.reconciled) return;
  display.actualPixels += after[0] - before[0];
  display.localDirect += after[1] - before[1];
  display.objectUrlCache += after[2] - before[2];
}
function displayDelta(key, mutate) {
  const before = displayContribution(key);
  mutate();
  applyDisplayDelta(key, before, displayContribution(key));
}
function renderRetryButtonState() {
  const button = document.getElementById("retry-failed");
  if (!button) return;
  const counts = getGalleryCounts(current.id);
  button.disabled = manualRetryRunning || !current.id || !(Number(counts.errorDone) > 0 || Number(counts.noFullDone) > 0);
}
function renderPrefetchStatus() {
  const counts = getGalleryCounts(current.id);
  const total = counts.total || prefetchTotal || (current.files ? current.files.length : 0);
  const display = getDisplayCounts(current.id);
  if (!display.reconciled) {
    for (const entry of current.files || []) {
      const key = fullCacheKey(entry, current.id);
      const sourceType = sourceTypeByEntry.get(key);
      const sourceStatus = sourceStatusByEntry.get(key);
      const pass = displayPassByEntry.get(key);
      if (pass) display.actualPixels++;
      if (pass && sourceType === "local-direct") display.localDirect++;
      if (activeObjectUrlKeys.has(key) && statusIsViewerDisplaySource(sourceStatus)) display.objectUrlCache++;
    }
    display.reconciled = true;
  }
  let text = "実表示ピクセル " + display.actualPixels + "/" + total +
    " | ローカル直接 " + display.localDirect + "/" + total +
    " | objectURLキャッシュ " + display.objectUrlCache + "/" + total +
    " | フル画像なし " + counts.noFullDone + "/" + total +
    " | TN表示フォールバック禁止";
  if (counts.errorDone) text += " | エラー " + counts.errorDone + "/" + total;
  fullDone = counts.fullDone;
  tnDone = counts.tnDone;
  errorDone = counts.errorDone;
  setPrefetchStatus(text);
  renderRetryButtonState();
}
function stripItems() {
  const badges = new Map();
  if (current.sceneIndexes && current.sceneIndexes.length) {
    for (let i = 0; i < current.sceneIndexes.length - 1; i++) {
      badges.set(current.sceneIndexes[i], current.sceneIndexes[i + 1] - current.sceneIndexes[i]);
    }
  }
  return current.files.map((entry, idx) => ({ page: idx + 1, entry, badge: badges.get(idx) || 0 }));
}
function stripGroupTotal(items) {
  return Math.max(1, Math.ceil(items.length / 50));
}
function stripGroupPage(items) {
  const total = stripGroupTotal(items);
  if (stripGroup && stripGroup >= 1 && stripGroup <= total) return stripGroup;
  const idx = items.findIndex((item) => item.page === current.page);
  if (idx >= 0) return Math.max(1, Math.floor(idx / 50) + 1);
  return Math.max(1, Math.floor((current.page - 1) / 50) + 1);
}
function renderStripControls(items, group) {
  const input = document.getElementById("strip-group");
  const status = document.getElementById("strip-group-status");
  const total = stripGroupTotal(items);
  if (input) input.value = String(group);
  if (status) status.textContent = "グループ " + group + "/" + total;
}
function setStripGroup(group) {
  if (!current.id) return;
  const items = stripItems();
  const total = stripGroupTotal(items);
  stripGroup = Math.max(1, Math.min(total, Number(group) || 1));
  renderStrip();
  const status = document.getElementById("strip-group-status");
  if (status) status.textContent = "ジャンプ: " + group + "/" + total;
}

function entryForPage(page) {
  return current.files[page - 1];
}

function doubleActive() { return viewMode !== "single" && window.innerWidth >= 720; }

function isAlreadyDoublePage(entry) {
  return entry && Number(entry.width) > Number(entry.height);
}

function displayModeFor(firstEntry) {
  if (fullscreenState !== "off") return "fullscreen" + (doubleActive() ? " double" : "");
  if (isAlreadyDoublePage(firstEntry)) return "single landscape";
  if (viewMode === "single" || window.innerWidth < 720) return "single";
  return "double";
}

function displayMode() { return displayModeFor(entryForPage(current.page)); }

function readerClass(firstEntry = null) {
  const entry = firstEntry && firstEntry.entry ? firstEntry.entry : firstEntry || entryForPage(current.page);
  if (isAlreadyDoublePage(entry)) return "reader single landscape";
  if (fullscreenState !== "off") return "reader fullscreen" + (doubleActive() ? " double" : "");
  return "reader " + displayModeFor(entry);
}

function displayPlaceholder(entry) { return ""; }

function readerItems() {
  const items = stripItems();
  const firstIdx = items.findIndex((item) => item.page === current.page);
  const first = firstIdx >= 0 ? items[firstIdx] : { page: current.page, entry: entryForPage(current.page), badge: 0 };
  const result = [first];
  if (doubleActive() && first.entry && !isAlreadyDoublePage(first.entry)) {
    let second = null;
    if (currentPairEnd > current.page) second = { page: currentPairEnd, entry: entryForPage(currentPairEnd), badge: 0 };
    else {
      const e = entryForPage(first.page + 1);
      if (e) second = { page: first.page + 1, entry: e, badge: 0 };
    }
    if (second && second.entry) result.push(second);
  }
  return result;
}

function movePage(delta) {
  const items = readerItems();
  if (delta > 0) {
    const next = doubleActive() && items.length > 1 ? items[1].page + 1 : current.page + delta;
    if (next < 1 || next > current.count) return false;
    current.page = next;
    currentPairEnd = null;
    return true;
  }
  const distance = doubleActive() && items.length > 1 ? items[1].page - current.page : 0;
  const prev = current.page - distance - 1;
  if (prev < 1 || prev > current.count) return false;
  current.page = prev;
  currentPairEnd = null;
  return true;
}

function fullscreenTarget() { return document.documentElement; }

function fullscreenElement() { return document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || null; }

function isActualFullscreen() { return fullscreenElement() === fullscreenTarget(); }

function syncFullscreenState() {
  if (isActualFullscreen()) {
    fullscreenState = "on";
  } else if (fullscreenState !== "fallback") {
    fullscreenState = "off";
  }
}

function applyFullscreenPresentation() {
  syncFullscreenState();
  document.body.classList.toggle("fullscreen", fullscreenState === "on");
  document.documentElement.classList.toggle("fullscreen", fullscreenState === "on");
  document.body.classList.toggle("pseudo-fullscreen", fullscreenState === "fallback");
}

function updateAfterFullscreenChange() {
  applyFullscreenPresentation();
  renderReader();
  renderPosition();
  renderViewState();
  startFullPrefetch();
}

function requestFullscreenWithFallback() {
  const target = fullscreenTarget();
  const api = target.requestFullscreen || target.webkitRequestFullscreen || target.mozRequestFullScreen || target.msRequestFullscreen;
  if (!api) {
    fullscreenState = "fallback";
    updateAfterFullscreenChange();
    return;
  }
  try {
    const result = api.call(target, { navigationUI: "hide" });
    if (result && typeof result.catch === "function") {
      result.catch(() => {
        fullscreenState = "fallback";
        updateAfterFullscreenChange();
      });
    }
    if (result && typeof result.then === "function") {
      result.then(() => {
        if (isActualFullscreen()) {
          fullscreenState = "on";
          updateAfterFullscreenChange();
        }
      });
    }
  } catch (err) {
    fullscreenState = "fallback";
    updateAfterFullscreenChange();
  }
}

function enterFullscreenFromGesture() {
  lastViewMode = viewMode || lastViewMode || "double";
  fullscreenState = "off";
  requestFullscreenWithFallback();
  if (isActualFullscreen()) {
    fullscreenState = "on";
    updateAfterFullscreenChange();
  }
}

function exitFullscreenFromGesture() {
  fullscreenState = "off";
  viewMode = lastViewMode || viewMode;
  const api = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
  if (api) {
    try {
      api.call(document);
    } catch (err) {}
  }
  updateAfterFullscreenChange();
}

function setFullscreenFromGesture() {
  if (isActualFullscreen() || fullscreenState !== "off") {
    exitFullscreenFromGesture();
  } else {
    enterFullscreenFromGesture();
  }
}

function setViewMode(mode) {
  if (mode === "fullscreen") {
    setFullscreenFromGesture();
    return;
  }
  if (mode === "single" || mode === "double") {
    viewMode = mode;
    lastViewMode = mode;
  }
  syncViewModeButtons();
  applyFullscreenPresentation();
  renderReader();
  renderPosition();
  renderViewState();
  startFullPrefetch();
}

function parseReaderHash(hash) {
  const g = hash.match(/^#\/g\/(\d+)(?:\/(?:page\/)?(\d+)(?:[-\/](\d+))?)?$/);
  if (g) return { id: Number(g[1]), page: Number(g[2] || 1), end: g[3] ? Number(g[3]) : null };
  const p = hash.match(/^#(\d+)(?:[-\/](\d+))?$/);
  if (p && current.id) return { id: current.id, page: Number(p[1]), end: p[2] ? Number(p[2]) : null };
  return null;
}

function setPrefetchStatus(text, isError = false) {
  const el = document.getElementById("prefetch-status");
  if (!el) return;
  el.classList.toggle("error", isError);
  el.textContent = text;
}

function renderPosition() {
  const el = document.getElementById("reader-position");
  if (!el) return;
  if (!current.id) {
    el.textContent = "";
    return;
  }
  const second = doubleActive() ? (currentPairEnd || (readerItems().length > 1 ? readerItems()[1].page : null)) : null;
  const page = second ? current.page + "-" + second : String(current.page);
  el.textContent = "位置: " + page + " / " + (current.count || "-");
}

function renderLoadingPosition(id, pageLabel, pairLabel) {
  const el = document.getElementById("reader-position");
  if (!el || !id) return;
  el.textContent = "位置: " + pageLabel + pairLabel + " / -";
}

function viewLabel(mode) {
  const labels = { single: "単一", double: "見開き", fullscreen: "全画面", off: "オフ", fallback: "フォールバック", active: "アクティブ" };
  return labels[mode] || mode;
}
function spreadButtonText(dir) {
  return dir === "rtl" ? "右→左" : "左→右";
}
function syncViewModeButtons() {
  const active = fullscreenState !== "off" ? "fullscreen" : viewMode;
  for (const button of document.querySelectorAll("#view-mode-buttons button[data-mode]")) {
    button.setAttribute("aria-pressed", button.dataset.mode === active ? "true" : "false");
  }
  const spreadButton = document.getElementById("spread-direction");
  if (spreadButton) {
    spreadButton.textContent = spreadButtonText(spreadDirection);
    spreadButton.setAttribute("aria-pressed", String(spreadDirection === "rtl"));
  }
}

function renderViewState() {
  const el = document.getElementById("view-state");
  if (!el) return;
  syncViewModeButtons();
  if (!current.id) {
    el.textContent = "表示: " + viewLabel(viewMode) + "・直前レイアウト: " + viewLabel(lastViewMode) + "・開き方向 " + spreadButtonText(spreadDirection) + "・全画面 " + viewLabel(fullscreenState);
    return;
  }
  const pair = doubleActive() ? (currentPairEnd || (readerItems().length > 1 ? readerItems()[1].page : null)) : null;
  const pageText = pair ? current.page + "-" + pair : String(current.page);
  el.textContent = "表示: " + viewLabel(viewMode) + "・表示モード " + viewLabel(displayMode()) + "・直前レイアウト " + viewLabel(lastViewMode) + "・開き方向 " + spreadButtonText(spreadDirection) + "・ページ " + pageText + " / " + (current.count || "-") + "・表示源 " + (displaySource || "-") + "・全画面 " + viewLabel(fullscreenState);
}

function loadSpreadDirection() {
  try {
    const dir = localStorage.getItem(SPREAD_DIRECTION_STORAGE_KEY);
    if (dir === "rtl" || dir === "ltr") spreadDirection = dir;
  } catch (err) {}
}

function setSpreadDirection(dir) {
  spreadDirection = dir === "ltr" ? "ltr" : "rtl";
  try {
    localStorage.setItem(SPREAD_DIRECTION_STORAGE_KEY, spreadDirection);
  } catch (err) {}
  const button = document.getElementById("spread-direction");
  if (button) button.textContent = spreadButtonText(spreadDirection);
  renderReader();
  renderPosition();
  renderViewState();
  startFullPrefetch();
}

function syncReadStateCache(id, patch) {
  const entry = galleryCache.get(id);
  if (!entry) return;
  if (!entry.read_state) entry.read_state = { gallery_id: id, last_page: current.page || 1, fully_read: 0, favorite: 0, viewed: 0 };
  for (const [key, value] of Object.entries(patch)) entry.read_state[key] = value;
}

function renderGalleryLoading(id, page, second) {

  reader.className = readerClass();

}

function updatePrefetchCounts(status, entry, galleryId = current.id, allowRecount = false) {
  if (galleryId !== current.id || backgroundGalleryId !== galleryId) return;
  const key = fullCacheKey(entry, galleryId);
  setSourceStatus(entry, status, galleryId);
  const counts = getGalleryCounts(galleryId);
  if (allowRecount && prefetchedEntries.has(key)) {
    const oldStatus = prefetchedEntries.get(key);
    if (oldStatus === "tn" || oldStatus === "no_tn") counts.tnDone--;
    else if (oldStatus === "no_full") counts.noFullDone--;
    else if (oldStatus === "error") counts.errorDone--;
    else counts.fullDone--;
    prefetchedEntries.set(key, status);
    if (status === "tn" || status === "no_tn") counts.tnDone++;
    else if (status === "no_full") counts.noFullDone++;
    else if (status === "error") counts.errorDone++;
    else counts.fullDone++;
    renderPrefetchStatus();
    return;
  }
  if (prefetchedEntries.has(key)) {
    renderPrefetchStatus();
    return;
  }
  prefetchedEntries.set(key, status);
  if (status === "tn") counts.tnDone++;
  else if (status === "no_full") counts.noFullDone++;
  else if (status === "error") counts.errorDone++;
  else counts.fullDone++;
  renderPrefetchStatus();
}

function entrySource(entry, galleryId = current.id, force = false) {
  const formats = entry.local_formats || [];
  if (formats.length) {
    return "/files/" + galleryId + "/" + encodePathSegment(entry.hash) + "." + encodePathSegment(formats[0]);
  }
  let src = "/api/image/" + encodePathSegment(entry.hash) + "?format=" + encodeURIComponent(entryFormat(entry, galleryId)) + "&gallery=" + encodeURIComponent(galleryId);
  if (force) src += "&force=1";
  return src;
}
function storeFullCache(entry, status, objectUrl, galleryId = current.id) {
  const key = fullCacheKey(entry, galleryId);
  if (objectUrl && statusIsViewerDisplaySource(status)) {
    if (!fullObjectUrls.has(objectUrl)) fullObjectUrls.add(objectUrl);
    displayDelta(key, () => activeObjectUrlKeys.add(key));
    fullObjectUrlLru.delete(key);
    fullObjectUrlLru.set(key, objectUrl);
    fullCache.set(key, { status, objectUrl });
    setSourceStatus(entry, status, galleryId);
    setSourceType(entry, "objectURL", galleryId);
    if (galleryId === current.id && backgroundGalleryId === galleryId) {
      updateThumbCache(key, objectUrl);
    }
    if (fullObjectUrls.size > MAX_FULL_CACHE_ENTRIES) { evictFullObjectUrls(key); }
    return;
  }
  fullCache.set(key, { status, objectUrl });
  setSourceStatus(entry, status, galleryId);
}

async function prefetchPageImage(entry, signal, galleryId = current.id, allowRecount = false, force = false) {
  if (galleryId !== current.id || backgroundGalleryId !== galleryId) return "error";
  const key = fullCacheKey(entry, galleryId);
  const cached = fullCache.get(key);
  if (cached && cached.objectUrl && statusIsViewerDisplaySource(cached.status)) return cached.status;
  if (entry.local_formats && entry.local_formats.length) {
    setSourceType(entry, "local-direct", galleryId);
    setSourceStatus(entry, "local", galleryId);
    updatePrefetchCounts("local", entry, galleryId, allowRecount);
    return "local";
  }
  const fullSrc = entrySource(entry, galleryId, force);
  const r = await fetch(fullSrc, { cache: "no-store", signal });
  if (signal.aborted) return "error";
  if (galleryId !== current.id || backgroundGalleryId !== galleryId) return "error";
  if (!r.ok) {
    const cache = r.headers.get("x-cache") || "error";
    storeFullCache(entry, cache, null, galleryId);
    updatePrefetchCounts(cache, entry, galleryId, allowRecount);
    return cache;
  }
  const cache = r.headers.get("x-cache") || "miss";
  if (galleryId !== current.id || backgroundGalleryId !== galleryId) return cache;
  if (cache === "tn") {
    storeFullCache(entry, "tn", null, galleryId);
    updatePrefetchCounts("tn", entry, galleryId, allowRecount);
    return cache;
  }
  const blob = await r.blob();
  if (galleryId !== current.id || backgroundGalleryId !== galleryId) return cache;
  const objectUrl = URL.createObjectURL(blob);
  storeFullCache(entry, cache, objectUrl, galleryId);
  updatePrefetchCounts(cache, entry, galleryId, allowRecount);
  return cache;
}

function revokeFullObjectUrls() {
  for (const objectUrl of fullObjectUrls) {
    URL.revokeObjectURL(objectUrl);
  }
  fullObjectUrls.clear();
  fullObjectUrlLru.clear();
  currentDisplayObjectUrlKeys.clear();
  currentGalleryObjectUrlKeys.clear();
  activeObjectUrlKeys.clear();
  displayCountsByGallery.clear();
  for (const cached of fullCache.values()) {
    if (cached) cached.objectUrl = null;
  }
  renderPrefetchStatus();
}

async function loadFullImage(img, entry, signal, galleryId = current.id, loadShowGen = showGeneration, loadOpenGen = openGeneration, loadRender = renderGeneration, allowRecount = false) {
  const targetPage = Number(img.dataset.page);
  const targetHash = img.dataset.hash;
  const targetRender = Number(img.dataset.render);
  if (loadShowGen !== showGeneration || loadOpenGen !== openGeneration || loadRender !== renderGeneration) return;
  const key = fullCacheKey(entry, galleryId);
  if (activeObjectUrlKeys.has(key)) {
    img.dataset.fullCache = sourceStatusByEntry.get(key) || "cache";
    img.dataset.sourceType = "objectURL";
    img.src = fullCache.get(key).objectUrl;
    recordImageDisplayPassFromImg(img, galleryId);
    return;
  }
  if (entry.local_formats && entry.local_formats.length) {
    img.dataset.fullCache = "local";
    img.dataset.sourceType = "local-direct";
    setSourceStatus(entry, "local", galleryId);
    setSourceType(entry, "local-direct", galleryId);
    updatePrefetchCounts("local", entry, galleryId, allowRecount);
    img.src = localDirectSrc(entry, galleryId);
    recordImageDisplayPassFromImg(img, galleryId);
    return;
  }
  const fullSrc = entrySource(entry, galleryId);
  try {
    const r = await fetch(fullSrc, { cache: "no-store", signal });
    if (signal.aborted) return;
    if (loadShowGen !== showGeneration || loadOpenGen !== openGeneration || loadRender !== renderGeneration) return;
    const cache = r.headers.get("x-cache") || "miss";
    if (r.status === 404 && cache === "no_full") {
      storeFullCache(entry, "no_full", null, galleryId);
      updatePrefetchCounts("no_full", entry, galleryId, allowRecount);
      if (loadShowGen === showGeneration && loadOpenGen === openGeneration && loadRender === renderGeneration && Number(img.dataset.render) === targetRender && Number(img.dataset.page) === targetPage && img.dataset.hash === targetHash) {
        setPrefetchStatus("フル画像なし: " + targetPage, true);
      }
      return;
    }
    if (!r.ok) {
      storeFullCache(entry, "error", null, galleryId);
      updatePrefetchCounts("error", entry, galleryId, allowRecount);
      if (loadShowGen === showGeneration && loadOpenGen === openGeneration && loadRender === renderGeneration && Number(img.dataset.render) === targetRender && Number(img.dataset.page) === targetPage && img.dataset.hash === targetHash) {
        setPrefetchStatus("画像読み込み失敗: " + targetPage, true);
      }
      return;
    }
    if (cache === "tn") {
      storeFullCache(entry, "tn", null, galleryId);
      updatePrefetchCounts("tn", entry, galleryId, allowRecount);
      if (loadShowGen === showGeneration && loadOpenGen === openGeneration && loadRender === renderGeneration && Number(img.dataset.render) === targetRender && Number(img.dataset.page) === targetPage && img.dataset.hash === targetHash) {
        setPrefetchStatus("TN表示フォールバック禁止: " + targetPage, true);
      }
      return;
    }
    const blob = await r.blob();
    const objectUrl = URL.createObjectURL(blob);
    if (loadShowGen !== showGeneration || loadOpenGen !== openGeneration || loadRender !== renderGeneration) {
      URL.revokeObjectURL(objectUrl);
      return;
    }
    storeFullCache(entry, cache, objectUrl, galleryId);
    updatePrefetchCounts(cache, entry, galleryId, allowRecount);
    if (loadShowGen === showGeneration && loadOpenGen === openGeneration && loadRender === renderGeneration && Number(img.dataset.render) === targetRender && Number(img.dataset.page) === targetPage && img.dataset.hash === targetHash) {
      img.dataset.fullCache = cache;
      img.dataset.sourceType = sourceTypeByEntry.get(key) || entrySourceType(entry, galleryId);
      img.src = objectUrl;
      recordImageDisplayPassFromImg(img, galleryId);
    }
  } catch (err) {
    if (signal.aborted) return;
    if (loadShowGen !== showGeneration || loadOpenGen !== openGeneration || loadRender !== renderGeneration) return;
    storeFullCache(entry, "error", null, galleryId);
    updatePrefetchCounts("error", entry, galleryId, allowRecount);
    if (loadShowGen === showGeneration && loadOpenGen === openGeneration && loadRender === renderGeneration && Number(img.dataset.render) === targetRender && Number(img.dataset.page) === targetPage && img.dataset.hash === targetHash) {
      setPrefetchStatus("画像読み込み失敗: " + targetPage, true);
    }
  }
}

function renderReader() {
  const container = document.getElementById("reader");
  if (!container || !current.id) return;
  renderGeneration++;
  currentDisplayObjectUrlKeys.clear();
  const items = readerItems();
  container.className = readerClass(items[0]);
  const parts = [];
  for (const item of items) {
    const entry = item.entry;
    if (!entry) continue;
    const key = fullCacheKey(entry, current.id);
    const sourceType = entrySourceType(entry, current.id);
    const src = displayViewerSource(entry, current.id);
    if (sourceType === "local-direct") {
      setSourceType(entry, sourceType, current.id);
      setSourceStatus(entry, "local", current.id);
    } else if (sourceType === "objectURL") {
      setSourceType(entry, sourceType, current.id);
      setSourceStatus(entry, sourceStatusByEntry.get(key) || fullCache.get(key).status || "cache", current.id);
      markDisplayObjectUrlKey(key);
    }
    const marker = entry.local ? " title='ローカル'" : "";
    const alt = "ページ " + item.page + (entry.local ? "・ローカル" : "");
    parts.push("<img data-viewer-display='1' data-gallery='" + current.id + "' data-page='" + item.page + "' data-hash='" + escapeHTML(entry.hash) + "' data-key='" + escapeHTML(key) + "' data-source-type='" + sourceType + "' data-render='" + renderGeneration + "' data-full='" + escapeHTML(entrySource(entry, current.id)) + "' src='" + escapeHTML(src) + "'" + marker + " alt='" + escapeHTML(alt) + "'>");
  }
  if (spreadDirection === "rtl" && items.length > 1) parts.reverse();
  container.innerHTML = parts.join("");
  attachDisplayLoadHandlers(container);
}

async function runPriority(displayed, signal) {
  const container = document.getElementById("reader");
  const priorityShowGen = showGeneration;
  const priorityOpenGen = openGeneration;
  const priorityRenderGen = renderGeneration;
  const priorityGalleryId = current.id;
  for (const item of displayed) {
    if (signal.aborted) return;
    if (priorityShowGen !== showGeneration || priorityOpenGen !== openGeneration || priorityRenderGen !== renderGeneration || priorityGalleryId !== current.id) return;
    const img = container && container.querySelector("img[data-page='" + item.page + "']");
    if (img) await loadFullImage(img, item.entry, signal, priorityGalleryId, priorityShowGen, priorityOpenGen, priorityRenderGen);
  }
}

function resetBackgroundPrefetch(displayed) {
  if (!current.id) return;
  if (backgroundSignal) backgroundSignal.abort();
  backgroundSignal = new AbortController();
  prefetchAbort = backgroundSignal;
  backgroundGalleryId = current.id;
  const signal = backgroundSignal.signal;
  const currentId = current.id;
  const displayedPages = new Set(displayed.map((item) => item.page));
  const items = stripItems().filter((item) => item.entry);
  const currentIdx = items.findIndex((item) => item.page === current.page);
  const order = [];
  if (currentIdx >= 0) {
    for (let distance = 0; distance <= Math.max(items.length - currentIdx, currentIdx); distance++) {
      const right = currentIdx + distance;
      const left = currentIdx - distance;
      if (right < items.length && !displayedPages.has(items[right].page) && !prefetchedEntries.has(fullCacheKey(items[right].entry, currentId))) order.push({ entry: items[right].entry, page: items[right].page, galleryId: currentId });
      if (distance > 0 && left >= 0 && !displayedPages.has(items[left].page) && !prefetchedEntries.has(fullCacheKey(items[left].entry, currentId))) order.push({ entry: items[left].entry, page: items[left].page, galleryId: currentId });
    }
  } else {
    for (let i = 0; i < items.length; i++) {
      if (!displayedPages.has(items[i].page) && !prefetchedEntries.has(fullCacheKey(items[i].entry, currentId))) order.push({ entry: items[i].entry, page: items[i].page, galleryId: currentId });
    }
  }
  const counts = getGalleryCounts(currentId);
  counts.total = items.length;
  renderPrefetchStatus();
  prefetchQueue.length = 0;
  prefetchQueueKeys.clear();
  for (const item of order) {
    const key = fullCacheKey(item.entry, item.galleryId);
    if (prefetchQueueKeys.has(key)) continue;
    prefetchQueueKeys.add(key);
    prefetchQueue.push(item);
  }
  currentPriorityDone = runPriority(displayed, signal);
  startBackgroundWorkers(signal);
}

function ensureBackgroundPrefetch(displayed) {
  if (!current.id) return;
  if (backgroundGalleryId !== current.id) {
    resetBackgroundPrefetch(displayed);
    return;
  }
  const signal = backgroundSignal.signal;
  currentPriorityDone = runPriority(displayed, signal);
}

function startFullPrefetch(displayed = readerItems()) {
  if (!current.id) return;
  ensureBackgroundPrefetch(displayed);
}

async function manualRetryFailedFullImages() {
  if (!current.id) return;
  if (manualRetryRunning) return;
  manualRetryRunning = true;
  const retryButton = document.getElementById("retry-failed");
  if (retryButton) retryButton.disabled = true;
  const signal = backgroundSignal ? backgroundSignal.signal : new AbortController().signal;
  const reader = document.getElementById("reader");
  try {
    for (const entry of current.files || []) {
      const key = fullCacheKey(entry, current.id);
      if (manualRetryingKeys.has(key)) continue;
      if (sourceStatusByEntry.get(key) !== "error" && sourceStatusByEntry.get(key) !== "no_full") continue;
      if (entry.local_formats && entry.local_formats.length) continue;

      manualRetryingKeys.add(key);

      try {
        await prefetchPageImage(entry, signal, current.id, true, true);

        const img = reader && Array.from(reader.querySelectorAll("img")).find((el) => el.dataset.hash === entry.hash);
        if (img) await loadFullImage(img, entry, signal, current.id, showGeneration, openGeneration, renderGeneration, true);
      } catch (err) {
        if (signal.aborted) break;
        updatePrefetchCounts("error", entry, current.id, true);
      }

      manualRetryingKeys.delete(key);
    }
  } finally {
    manualRetryRunning = false;
    renderPrefetchStatus();
    renderRetryButtonState();
  }
}

function startBackgroundWorkers(signal) {
  async function worker() {
    while (prefetchQueue.length && !signal.aborted) {
      await currentPriorityDone;
      if (signal.aborted) return;
      const item = prefetchQueue.shift();
      if (!item) return;
      try {
        const cache = await prefetchPageImage(item.entry, signal, item.galleryId);
        if (signal.aborted) return;
        updatePrefetchCounts(cache, item.entry, item.galleryId);
      } catch (err) {
        if (signal.aborted) return;
        updatePrefetchCounts("error", item.entry, item.galleryId);
      }
    }
  }
  for (let i = 0; i < PREFETCH_CONCURRENCY; i++) worker();
}

const readListsDebounceMs = 250;
let readListsDebounceTimer = null;
let lastReadPostKey = "";

function runBackgroundRead(showGen, openGen) {
  if (showGen !== showGeneration || openGen !== openGeneration) return;
  if (readListsDebounceTimer) clearTimeout(readListsDebounceTimer);
  readListsDebounceTimer = setTimeout(() => {
    readListsDebounceTimer = null;
    if (showGen !== showGeneration || openGen !== openGeneration) return;
    const readKey = current.id + "/" + current.page;
    if (readKey === lastReadPostKey) {
      highlightStrip();
      return;
    }
    const lastPage = current.count || (current.files || []).length;
    const lastShown = doubleActive() ? (Number(currentPairEnd) || current.page) : current.page;
    const complete = lastPage > 0 && lastShown >= lastPage;
    post("/api/read", { gallery_id: current.id, page: lastShown, complete }).then(() => {
      if (showGen !== showGeneration || openGen !== openGeneration) return;
      lastReadPostKey = readKey;
      highlightStrip();
    }).catch((err) => {
      if (showGen === showGeneration && openGen === openGeneration) {
        const status = document.getElementById("prefetch-status");
        if (status) {
          status.classList.toggle("error", true);
          status.textContent = "読み状態送信エラー: " + err.message;
        }
      }
    });
  }, readListsDebounceMs);
}

async function showPage() {
  if (!current.id) return;
  refreshStrip();
  const entry = current.files[current.page - 1];
  if (!entry) {
    setPrefetchStatus("ページ範囲外", true);
    return;
  }
  const data = { page: current.page, src: entrySource(entry, current.id), local: !!entry.local, format: formatForEntry(entry) };
  const showGen = ++showGeneration;
  const openGen = openGeneration;
  const displayed = readerItems().filter((item) => item.entry);
  currentPairEnd = doubleActive() && displayed.length > 1 ? displayed[1].page : null;
  renderReader();
  ensureBackgroundPrefetch(displayed);
  displaySource = data.local ? "local" : "cdn/TN（未ダウンロード）";
  document.getElementById("pagenum").value = current.page;
  renderPosition();
  renderViewState();
  setRoute(current.id, current.page);
  if (showGen !== showGeneration || openGen !== openGeneration) return;
  runBackgroundRead(showGen, openGen);
}
async function openGallery(id, page, second) {
  const gen = ++openGeneration;
  stripGroup = null;
  stripRenderedGallery = null;
  stripRenderedGroup = null;
  if (prefetchAbort) prefetchAbort.abort();
  if (backgroundSignal) backgroundSignal.abort();
  backgroundGalleryId = null;
  history.replaceState(null, "", route(id, page, second));
  post("/api/viewed", { gallery_id: id }).catch(() => {});
  const cached = galleryCache.get(id);
  if (cached) {
    if (page) current.page = page;
    currentPairEnd = second || null;
    setGalleryMeta(cached);
    await showPage();
    if (gen !== openGeneration) return;
    return;
  }
  showGalleryMetaFromCache(id);
  renderGalleryLoading(id, page, second);
  renderStripLoading(id);
  const data = await api("/api/gallery/" + id);
  if (gen !== openGeneration) return;
  galleryCache.set(id, data);
  setGalleryMeta(data);
  if (page) current.page = page;
  currentPairEnd = second || null;
  await showPage();
  if (gen !== openGeneration) return;
}
function renderStrip() {
  const parts = [];
  currentGalleryObjectUrlKeys.clear();
  const items = stripItems();
  const group = stripGroupPage(items);
  stripRenderedGallery = current.id;
  stripRenderedGroup = group;
  renderStripControls(items, group);
  const start = (group - 1) * 50;
  const end = Math.min(start + 50, items.length);
  for (let i = start; i < end; i++) {
    const item = items[i];
    const entry = item.entry;
    const page = item.page;
    const key = fullCacheKey(entry, current.id);
    const sourceType = entrySourceType(entry, current.id);
    const src = stripThumbSource(entry, current.id);
    if (sourceType === "local-direct") {
      setSourceType(entry, sourceType, current.id);
      setSourceStatus(entry, "local", current.id);
    } else if (sourceType === "objectURL") {
      setSourceType(entry, sourceType, current.id);
      setSourceStatus(entry, sourceStatusByEntry.get(key) || fullCache.get(key).status || "cache", current.id);
      markGalleryObjectUrlKey(key);
    }
    const marker = entry.local ? " title='ローカル'" : "";
    const localMark = entry.local ? "・ローカル" : "";
    const badge = item.badge > 1 ? "<div class='badge'>" + item.badge + "</div>" : "";
    parts.push("<a href='" + route(current.id, page) + "'" + marker + targetAttr() + "><img class='" + (page === current.page ? "current" : "") + "' data-viewer-display='1' data-gallery='" + current.id + "' data-id='" + current.id + "' data-page='" + page + "' data-hash='" + escapeHTML(entry.hash) + "' data-key='" + escapeHTML(key) + "' data-source-type='" + sourceType + "' data-local='" + (entry.local ? "1" : "0") + "' loading='lazy' src='" + escapeHTML(src) + "' alt='ページ " + page + localMark + "'>" + badge + "</a>");
  }
  document.getElementById("thumbs").innerHTML = parts.join("");
  attachDisplayLoadHandlers(document.getElementById("thumbs"));
  highlightStrip();
}
function highlightStrip() {
  const pages = readerItems().map((item) => item.page);
  document.querySelectorAll("#thumbs img").forEach((img) => {
    img.classList.toggle("current", pages.includes(Number(img.dataset.page)));
  });
}
function refreshStrip() {
  const items = stripItems();
  const group = stripGroupPage(items);
  if (stripRenderedGallery === current.id && group === stripRenderedGroup) {
    highlightStrip();
    return false;
  }
  renderStrip();
  return true;
}
function renderStripLoading(id) {
  const thumbs = document.getElementById("thumbs");
  if (!thumbs) return;
  thumbs.innerHTML = "<div class='strip-loading' data-strip-loading data-id='" + id + "' aria-busy='true'>読み込み中</div>";
}

function showGalleryMetaFromCache(id) {
  const card = galleryCache.get(id);
  const title = (card && card.gallery && card.gallery.title) || id;
  document.getElementById("gallery").innerHTML =
    "<b>" + escapeHTML(title) + "</b> <span class='meta'>" + escapeHTML((card && card.gallery && card.gallery.language) || "") + " / " + escapeHTML((card && card.gallery && card.gallery.type) || "") + "</span><br>" +
    "<span class='meta'>" + escapeHTML(((card && card.gallery && card.gallery.tags) || []).join(", ")) + "</span><br>" +
    "<span class='meta'>読み込み中</span>";
  setPrefetchStatus("ギャラリー読み込み: " + id);
  updateTabTitle((card && card.gallery && card.gallery.japanese_title) || title || id);
}
function updateThumbCache(key, objectUrl) {
  if (!objectUrl) return;
  const stripImg = Array.from(document.querySelectorAll("#thumbs img")).find((el) => el.dataset.key === key);
  if (stripImg) stripImg.src = objectUrl;
}
function formatForEntry(entry) {
  return entry.hasavif ? "avif" : (current.format || "webp");
}
function stripVariant() {
  return window.devicePixelRatio === 1 ? "smallsmalltn" : "smalltn";
}
function stripThumbSource(entry, galleryId = current.id) {
  return displayViewerSource(entry, galleryId);
}

let acquisitionAbort = false;
let acquisitionDone = 0;
let acquisitionOverwrite = false;
let acquisitionRunFolderConfirmed = false;

function renderAcquisitionStatus() {
  const status = document.getElementById("acquisition-status");
  if (!status) return;
  status.textContent = acquisitionAbort
    ? "acquisition: abort"
    : "acquisition progress " + acquisitionDone + "/" + (current.files.length || 0);
}

function appendAcquisitionResult(r) {
  const results = document.getElementById("acquisition-results");
  if (!results) return;
  const line = document.createElement("div");
  const parts = [];
  if (r.page) parts.push("page " + r.page);
  if (r.hash) parts.push(String(r.hash));
  parts.push(String(r.status || "unknown"));
  if (r.path) parts.push(String(r.path));
  if (r.error) parts.push(String(r.error));
  line.textContent = parts.join(" ");
  results.appendChild(line);
}

async function runAcquisition() {
  if (!current.id) return;
  acquisitionAbort = false;
  acquisitionDone = 0;
  acquisitionOverwrite = false;
  acquisitionRunFolderConfirmed = false;
  const results = document.getElementById("acquisition-results");
  if (results) results.textContent = "";
  renderAcquisitionStatus();

  const check = await post("/api/acquisition/check", { gallery_id: current.id });
  if (check.status === "confirm") {
    if (acquisitionRunFolderConfirmed) {
      return;
    }
    if (!window.confirm("既存の同名タイトルフォルダがあります。上書きしますか？")) {
      appendAcquisitionResult({ status: "skipped", path: check.path || "" });
      return;
    }
  }
  acquisitionRunFolderConfirmed = true;
  acquisitionOverwrite = true;

  for (let i = 0; i < current.files.length; i++) {
    if (acquisitionAbort) break;
    const entry = current.files[i];
    const page = i + 1;
    const request = { gallery_id: current.id, page, hash: entry.hash, format: entryFormat(entry), overwrite: acquisitionOverwrite };
    try {
      let result = await post("/api/cache/acquire", request);
      if (result.status === "confirm") {
        appendAcquisitionResult({ ...result, page, hash: entry.hash });
        appendAcquisitionResult({ page, hash: entry.hash, status: "skipped", path: result.path || "" });
        acquisitionDone++;
        renderAcquisitionStatus();
        continue;
      }
      appendAcquisitionResult({ ...result, page, hash: entry.hash, status: acquisitionOverwrite ? "overwrite" : result.status });
    } catch (err) {
      appendAcquisitionResult({ page, hash: entry.hash, status: "error", error: err.message || String(err) });
    }
    acquisitionDone++;
    renderAcquisitionStatus();
  }

  renderAcquisitionStatus();
}

document.getElementById("acquisition-start").addEventListener("click", runAcquisition);
document.getElementById("acquisition-abort").addEventListener("click", () => {
  acquisitionAbort = true;
  renderAcquisitionStatus();
});

window.addEventListener("hashchange", async () => {
  const reader = parseReaderHash(window.location.hash);
  if (reader) { await openGallery(reader.id, reader.page, reader.end); return; }
});

async function handleCardClick(e) {
  const t = e.target.closest("[data-id][data-page]");
  if (!t) return;
  if (e.button !== 0 || e.ctrlKey || e.metaKey || e.shiftKey || e.altKey) return;
  e.preventDefault();
  const id = Number(t.dataset.id);
  const page = Number(t.dataset.page);
  if (newTabMode) {
    window.open(newTabHref(route(id, page)), "_blank");
    return;
  }
  await openGallery(id, page);
}
document.getElementById("thumbs").addEventListener("click", handleCardClick);
const resizeDebounceMs = 150;
let resizeDebounceTimer = null;
window.addEventListener("resize", () => {
  if (!current.id) return;
  const resizeOpenGen = openGeneration;
  if (resizeDebounceTimer) clearTimeout(resizeDebounceTimer);
  resizeDebounceTimer = setTimeout(() => {
    resizeDebounceTimer = null;
    if (!current.id || resizeOpenGen !== openGeneration) return;
    renderReader();
    renderPosition();
    renderViewState();
    startFullPrefetch();
  }, resizeDebounceMs);
});
window.addEventListener("keydown", async (e) => {
  if (!current.id || e.target.tagName === "INPUT") return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === "f") {
    setFullscreenFromGesture();
    return;
  }
  if (e.key === "Escape") {
    if (fullscreenState !== "off") setFullscreenFromGesture();
    return;
  }
  if (e.key === "ArrowLeft") { if (movePage(spreadDirection === "rtl" ? 1 : -1)) await showPage(); }
  if (e.key === "ArrowRight") { if (movePage(spreadDirection === "rtl" ? -1 : 1)) await showPage(); }
  if (e.target.tagName === "BUTTON" || e.target.tagName === "SELECT") return;
  if (e.key === "d") setViewMode("double");
  if (e.key === "s") setViewMode("single");
  if (e.key === "r") setSpreadDirection(spreadDirection === "rtl" ? "ltr" : "rtl");
});
document.getElementById("strip-prev-group").addEventListener("click", () => {
  setStripGroup(stripGroupPage(stripItems()) - 1);
});
document.getElementById("strip-next-group").addEventListener("click", () => {
  setStripGroup(stripGroupPage(stripItems()) + 1);
});
document.getElementById("strip-go-group").addEventListener("click", () => {
  setStripGroup(Number(document.getElementById("strip-group").value) || 1);
});
document.getElementById("strip-group").addEventListener("change", () => {
  setStripGroup(Number(document.getElementById("strip-group").value) || 1);
});
document.getElementById("retry-failed").addEventListener("click", () => {
  void manualRetryFailedFullImages();
});
document.getElementById("nav").addEventListener("submit", (e) => { e.preventDefault(); });
document.getElementById("prev").addEventListener("click", async () => { if (movePage(-1)) await showPage(); });
document.getElementById("next").addEventListener("click", async () => { if (movePage(1)) await showPage(); });
document.getElementById("pagenum").addEventListener("change", async () => {
  const page = Number(document.getElementById("pagenum").value || current.page);
  if (current.id && page >= 1 && page <= current.count) { current.page = page; await showPage(); }
});
document.getElementById("fav").addEventListener("click", async () => {
  if (!current.id) return;
  const on = !current.favorite;
  await post("/api/fav", { gallery_id: current.id, on });
  current.favorite = on ? 1 : 0;
  syncReadStateCache(current.id, { favorite: current.favorite });
});
document.getElementById("complete").addEventListener("click", async () => {
  if (!current.id) return;
  await post("/api/read", { gallery_id: current.id, page: current.page, complete: true });
  syncReadStateCache(current.id, { last_page: current.page, fully_read: 1 });
});
document.getElementById("view-mode-buttons").addEventListener("click", (e) => {
  const modeButton = e.target.closest("button[data-mode]");
  if (modeButton) {
    e.preventDefault();
    setViewMode(modeButton.dataset.mode);
    modeButton.blur();
    return;
  }
  const spreadButton = e.target.closest("button[id='spread-direction']");
  if (spreadButton) {
    e.preventDefault();
    setSpreadDirection(spreadDirection === "rtl" ? "ltr" : "rtl");
    spreadButton.blur();
  }
});
document.addEventListener("fullscreenchange", () => {
  if (isActualFullscreen()) {
    fullscreenState = "on";
  } else if (fullscreenState === "fallback") {
    updateAfterFullscreenChange();
    return;
  } else {
    fullscreenState = "off";
    viewMode = lastViewMode || viewMode;
  }
  updateAfterFullscreenChange();
});

document.addEventListener("fullscreenerror", () => {
  if (fullscreenState !== "off") {
    fullscreenState = "fallback";
    updateAfterFullscreenChange();
  }
});

function applyViewerConfigCap() {
  fetch("/api/viewer-config", { cache: "no-store" }).then((r) => r.json()).then((cfg) => {
    const cap = Number(cfg && cfg.max_object_urls);
    if (Number.isFinite(cap) && cap >= 1000) {
      MAX_FULL_CACHE_ENTRIES = cap;
    }
    if (fullObjectUrls.size > MAX_FULL_CACHE_ENTRIES) { evictFullObjectUrls(); }
  }).catch(() => {});
}

applyViewerConfigCap();

loadSpreadDirection();
const spreadButton = document.getElementById("spread-direction");
if (spreadButton) spreadButton.textContent = spreadDirection;
const initial = parseReaderHash(window.location.hash);
if (initial) {
  openGallery(initial.id, initial.page, initial.end);
} else {
  renderViewState();
}
</script>
