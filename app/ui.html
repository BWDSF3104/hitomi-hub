<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>hitomi hub viewer</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 1rem; background: #14161a; color: #e8eaed; height: calc(100vh - 2rem); overflow: hidden; display: flex; flex-direction: column; }
  h1 { font-size: 1.1rem; margin: 0 0 .8rem; }
  .cols { display: flex; gap: 1rem; align-items: flex-start; flex: 1; min-height: 0; }
  .side { width: 30rem; height: 100%; min-height: 0; overflow-y: auto; }
  .main { flex: 1; min-width: 20rem; height: 100%; min-height: 0; overflow-y: auto; }
  section { margin-bottom: 1rem; }
  h2 { font-size: .95rem; margin: 0 0 .4rem; color: #9aa0a6; }
  form { display: flex; gap: .4rem; flex-wrap: wrap; align-items: center; }
  input { padding: .35rem; background: #1d2126; color: #e8eaed; border: 1px solid #2f343b; }
  button { padding: .35rem .6rem; background: #2f343b; color: #e8eaed; border: 0; cursor: pointer; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: .3rem 0; border-bottom: 1px solid #23272d; }
  a { color: #8ab4f8; text-decoration: none; }
  .meta { font-size: .9rem; color: #9aa0a6; }
  .note { font-size: .85rem; color: #f0a441; }
  .status { font-size: .85rem; color: #8ab4f8; margin-bottom: .4rem; }
  .card { display: flex; gap: .5rem; align-items: flex-start; --search-card-height: 130px; }
  .cover, .search-card-cover, .strip img { object-fit: cover; background: #1d2126; }
  .cover, .search-card-cover { width: 130px; height: 130px; }
  .card a { font-weight: 600; }
  .tags, .strip { margin-top: .35rem; }
  .tags {
    font-size: .9rem;
    line-height: 1.25;
    max-height: var(--search-card-height);
    overflow: hidden;
    overflow-wrap: anywhere;
    display: -webkit-box;
    -webkit-line-clamp: 9;
  }
  .strip { display: flex; gap: .3rem; flex-wrap: wrap; }
  .strip img { width: 90px; height: 90px; }
  .strip .strip-loading {
    width: 90px;
    height: 90px;
    background: #1d2126;
    border: 1px solid #2f343b;
    color: #9aa0a6;
    font-size: .8rem;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .strip a { position: relative; }
  .badge { position: absolute; right: 4px; top: 4px; background: #8ab4f8; color: #14161a; padding: 2px 5px; border-radius: 4px; font-size: .8rem; }
  .current { border: 2px solid #8ab4f8; }
  .pageimg { max-width: 100%; max-height: 78vh; background: #1d2126; object-fit: contain; }
  .reader .reader-loading {
    grid-column: 1 / -1;
    display: flex;
    gap: .5rem;
    align-items: center;
    padding: .5rem;
    background: #1d2126;
    border: 1px solid #2f343b;
    min-height: var(--reader-page-height);
    color: #9aa0a6;
  }
  .reader-loading img { max-width: 180px; max-height: 180px; object-fit: contain; background: #14161a; }
  .reader-loading-text { color: #8ab4f8; font-size: .9rem; }
  .reader {
    --reader-page-width: min(45vw, 500px);
    --reader-page-height: min(78vh, 700px);
    display: grid;
    gap: 0;
    grid-template-columns: repeat(2, minmax(0, var(--reader-page-width)));
  }
  .reader.double { grid-template-columns: repeat(2, minmax(0, var(--reader-page-width))); }
  .reader:not(.double) { grid-template-columns: minmax(0, var(--reader-page-width)); }
  .reader.landscape { --reader-page-width: min(92vw, calc(var(--reader-page-height) * 1.6)); grid-template-columns: minmax(0, var(--reader-page-width)); }
  .reader img {
    display: block;
    width: min(var(--reader-page-width), 100%);
    height: var(--reader-page-height);
    background: #1d2126;
    object-fit: contain;
  }
  body.fullscreen .side { display: none; }
  body.fullscreen .reader { --reader-page-height: min(90vh, 700px); }
  body.fullscreen .reader img { height: var(--reader-page-height); }
</style>
</head>
<body>
<h1>hitomi hub viewer（ローカル 1 ページ）</h1>
<div class="cols">
  <div class="side">
    <section>
      <h2>検索（hitomi search.html と同じ term routing）</h2>
      <form id="search">
        <input id="query" value="furry" size="30" placeholder="furry / female:yuri language:english">
        <input id="lang" value="all" size="8">
        <input id="page" value="1" size="4">
        <button id="search-prev">前</button>
        <button id="search-next">次</button>
        <button id="search-submit">検索</button>
      </form>
      <div id="search-page-status" class="meta"></div>
      <div id="search-status" class="status"></div>
      <div id="count" class="meta"></div>
      <ul id="results"></ul>
    </section>
    <section>
      <h2>保存検索</h2>
      <form id="query">
        <input id="qname" placeholder="name" size="10">
        <input id="qtext" placeholder="female:yuri language:english" size="22">
        <button>save</button>
      </form>
      <ul id="queries"></ul>
    </section>
    <section>
      <h2>お気に入り / 未読</h2>
      <ul id="favorites"></ul>
      <ul id="unread"></ul>
    </section>
  </div>
  <div class="main">
    <section>
      <h2>閲覧</h2>
      <div id="gallery" class="meta">検索結果から gallery を選ぶ</div>
      <div id="reader-controls" class="meta">
        <select id="view-mode">
          <option value="double">見開き（通常）</option>
          <option value="single">単一</option>
          <option value="fullscreen">フルスクリーン</option>
        </select>
        <span class="meta">キーボード: ← / → / d=見開き / s=単一 / f=フルスクリーン</span>
        <div id="view-mode-buttons" class="meta">
          <button type="button" data-mode="single">single</button>
          <button type="button" data-mode="double">double</button>
          <button type="button" data-mode="fullscreen">fullscreen</button>
          <button type="button" id="spread-direction" data-direction="rtl">rtl</button>
        </div>
        <div id="view-state" class="meta"></div>
      </div>
      <div id="reader-position" class="meta"></div>
      <div id="note" class="note"></div>
      <div id="prefetch-status" class="status"></div>
      <div id="reader" class="reader double"></div>
      <form id="nav">
        <button id="prev">前</button>
        <input id="pagenum" size="4">
        <button id="next">次</button>
        <button id="complete">読み完了</button>
        <button id="fav">お気に入り</button>
      </form>
      <div class="meta">キーボード: ← / → でページ送リ。通常サイズでは見開き。</div>
      <div id="strip-controls" class="meta">
        <button id="strip-prev-group">前 group</button>
        <input id="strip-group" size="4" placeholder="group">
        <button id="strip-go-group">go</button>
        <button id="strip-next-group">次 group</button>
        <span id="strip-group-status" class="meta">strip group -</span>
      </div>
      <div class="strip" id="thumbs"></div>
    </section>
  </div>
</div>
<script>
const api = (p) => fetch(p).then(async (r) => {
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || (r.status + " " + p));
  return data;
});
const post = (p, body) => fetch(p, { method: "POST", headers: { "content-type": "application/json" },
  body: JSON.stringify(body) }).then(async (r) => {
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || (r.status + " " + p));
  return data;
});

const newTabMode = new URLSearchParams(window.location.search).get("newtab") === "1";
let current = { id: 0, page: 1, count: 0, favorite: 0, files: [] };
let viewMode = "double";
let currentPairEnd = null;
let stripGroup = null;
let prefetchAbort = null;
let backgroundSignal = null;
let backgroundGalleryId = null;
const prefetchQueue = [];
const prefetchQueueKeys = new Set();
let fullDone = 0;
let tnDone = 0;
let errorDone = 0;
let prefetchTotal = 0;
const PREFETCH_CONCURRENCY = 4;
const SEARCH_STORAGE_KEY = "hitomi_hub_last_search";
const MAX_FULL_CACHE_ENTRIES = 2000;
let fullObjectUrls = new Set();
const fullCache = new Map();
const prefetchedEntries = new Map();
const countsByGallery = new Map();
const displayPassByEntry = new Map();
const sourceStatusByEntry = new Map();
const sourceTypeByEntry = new Map();
const activeObjectUrlKeys = new Set();
const galleryCache = new Map();
const searchCardCache = new Map();
const galleryFormats = new Map();
let currentSearchTotal = 0;
let spreadDirection = "rtl";
const SPREAD_DIRECTION_STORAGE_KEY = "hitomi_hub_spread_direction";
let searchGeneration = 0;
let openGeneration = 0;
let showGeneration = 0;
let renderGeneration = 0;
let currentPriorityDone = Promise.resolve();

function escapeHTML(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}
function targetAttr() {
  return newTabMode ? " target='_blank'" : "";
}
function route(id, page, second) {
  if (second) return "#/g/" + id + "/page/" + page + "-" + second;
  return "#/g/" + id + "/page/" + page;
}
function setRoute(id, page) {
  const items = readerItems();
  const second = doubleActive() && items.length > 1 ? items[1].page : null;
  history.replaceState(null, "", route(id, page, second));
}
function updateTabTitle(title) {
  const display = title || current.id;
  if (!display) return;
  document.title = String(display) + " - hitomi hub viewer";
}

function setGalleryMeta(data) {
  const g = data.gallery, s = data.read_state;
  const sceneIndexes = g.scene_indexes || [];
  const count = sceneIndexes.length ? sceneIndexes.length - 1 : g.files.length;
  current = {
    id: g.id, page: current.page || s.last_page || 1, count, favorite: s.favorite, files: g.files,
    sceneIndexes, format: data.format || "webp"
  };
  galleryFormats.set(g.id, data.format || "webp");
  document.getElementById("gallery").innerHTML =
    "<b>" + escapeHTML(g.title || current.id) + "</b> <span class='meta'>" + escapeHTML(g.language) + " / " + escapeHTML(g.type) + "</span><br>" +
    "<span class='meta'>" + escapeHTML((g.artists || []).join(", ")) + "</span><br>" +
    "<span class='meta'>" + escapeHTML((g.tags || []).join(", ")) + "</span><br>" +
    "<span class='meta'>" + current.count + " files・local " + data.local + "（format " + escapeHTML(data.format) + "）</span>";
  document.getElementById("pagenum").value = current.page;
  renderPosition();
  renderViewState();
  updateTabTitle(g.japanese_title || g.title || current.id);
}
function fileFormatFromName(name) {
  const ext = String(name || "").split(".").pop().toLowerCase();
  if (ext === "jpeg") return "jpg";
  return ext || "webp";
}

function thumbURL(hash, format, gallery, variant) {
  if (!hash) return "";
  let u = "/api/thumb/" + hash + "?format=" + encodeURIComponent(format || "webp");
  if (gallery) u += "&gallery=" + encodeURIComponent(gallery);
  if (variant) u += "&variant=" + encodeURIComponent(variant);
  return u;
}

function stripVariant() {
  return window.devicePixelRatio === 1 ? "smallsmalltn" : "smalltn";
}
function stripThumbSource(entry, galleryId = current.id) {
  return displayViewerSource(entry, galleryId);
}
function updateThumbCache(key, objectUrl) {
  if (!objectUrl) return;
  const stripImg = document.querySelector("#thumbs img[data-key=\"" + key + "\"]");
  if (stripImg) stripImg.src = objectUrl;
  const cardCover = document.querySelector("#results img[data-key=\"" + key + "\"]");
  if (cardCover) cardCover.src = objectUrl;
}
function formatForEntry(entry) {
  return entry.hasavif ? "avif" : (current.format || "webp");
}
function entryFormat(entry, galleryId = current.id) {
  return entry.hasavif ? "avif" : (galleryFormats.get(galleryId) || current.format || "webp");
}
function fullCacheKey(entry, galleryId = current.id) {
  return galleryId + "|" + entry.hash + "|" + entryFormat(entry, galleryId);
}
function cachedFullSrc(entry, galleryId = current.id) {
  const key = fullCacheKey(entry, galleryId);
  const cached = fullCache.get(key);
  if (cached && cached.objectUrl && statusIsViewerDisplaySource(sourceStatusByEntry.get(key))) return cached.objectUrl;
  return "";
}

function localDirectSrc(entry, galleryId = current.id) {
  const formats = entry.local_formats || [];
  if (!formats.length) return "";
  return "/files/" + galleryId + "/" + entry.hash + "." + formats[0];
}

function statusIsViewerDisplaySource(status) {
  return status !== "tn" && status !== "tn-cache" && status !== "no_full" && status !== "error";
}

function entrySourceType(entry, galleryId = current.id) {
  const key = fullCacheKey(entry, galleryId);
  if (activeObjectUrlKeys.has(key)) return "objectURL";
  if (localDirectSrc(entry, galleryId)) return "local-direct";
  return "";
}

function displayViewerSource(entry, galleryId = current.id) {
  const key = fullCacheKey(entry, galleryId);
  if (activeObjectUrlKeys.has(key)) return fullCache.get(key).objectUrl || "";
  return localDirectSrc(entry, galleryId);
}

function setSourceStatus(entry, status, galleryId = current.id) {
  sourceStatusByEntry.set(fullCacheKey(entry, galleryId), status);
}

function setSourceTypeFromKey(key, type) {
  if (key) sourceTypeByEntry.set(key, type);
}

function setSourceType(entry, type, galleryId = current.id) {
  setSourceTypeFromKey(fullCacheKey(entry, galleryId), type);
}

function recordImageDisplayPassFromImg(img, galleryId = current.id) {
  if (!img || !img.dataset.key) return;
  const sourceType = img.dataset.sourceType || sourceTypeByEntry.get(img.dataset.key);
  if (!sourceType) return;
  if (img.dataset.gallery && img.dataset.gallery !== String(galleryId)) return;
  if (img.naturalWidth > 0) {
    displayPassByEntry.set(img.dataset.key, true);
    setSourceTypeFromKey(img.dataset.key, sourceType);
    renderPrefetchStatus();
  }
}

function attachDisplayLoadHandlers(container) {
  if (!container) return;
  for (const img of container.querySelectorAll("img[data-viewer-display]")) {
    recordImageDisplayPassFromImg(img);
    img.addEventListener("load", () => recordImageDisplayPassFromImg(img));
  }
}
function getGalleryCounts(galleryId) {
  if (!countsByGallery.has(galleryId)) {
    countsByGallery.set(galleryId, { fullDone: 0, tnDone: 0, noFullDone: 0, errorDone: 0, total: 0 });
  }
  return countsByGallery.get(galleryId);
}
function renderPrefetchStatus() {
  const counts = getGalleryCounts(current.id);
  const total = counts.total || prefetchTotal || (current.files ? current.files.length : 0);
  let actualPixels = 0;
  let localDirect = 0;
  let objectUrlCache = 0;
  for (const entry of current.files || []) {
    const key = fullCacheKey(entry, current.id);
    const sourceType = sourceTypeByEntry.get(key);
    const sourceStatus = sourceStatusByEntry.get(key);
    const pass = displayPassByEntry.get(key);
    if (pass) actualPixels++;
    if (pass && sourceType === "local-direct") localDirect++;
    if (activeObjectUrlKeys.has(key) && statusIsViewerDisplaySource(sourceStatus)) objectUrlCache++;
  }
  let text = "actual pixels " + actualPixels + "/" + total +
    " | local direct " + localDirect + "/" + total +
    " | objectURL cache " + objectUrlCache + "/" + total +
    " | no full " + counts.noFullDone + "/" + total +
    " | TN display fallback disabled";
  if (counts.errorDone) text += " | error " + counts.errorDone + "/" + total;
  fullDone = counts.fullDone;
  tnDone = counts.tnDone;
  errorDone = counts.errorDone;
  setPrefetchStatus(text);
}
function stripItems() {
  if (current.sceneIndexes && current.sceneIndexes.length) {
    return current.sceneIndexes.slice(0, current.sceneIndexes.length - 1).map((sceneIndex, idx) => ({
      page: sceneIndex + 1,
      entry: current.files[sceneIndex],
      badge: current.sceneIndexes[idx + 1] ? current.sceneIndexes[idx + 1] - sceneIndex : 0
    }));
  }
  return current.files.map((entry, idx) => ({ page: idx + 1, entry, badge: 0 }));
}
function stripGroupTotal(items) {
  return Math.max(1, Math.ceil(items.length / 50));
}
function stripGroupPage(items) {
  const total = stripGroupTotal(items);
  if (stripGroup && stripGroup >= 1 && stripGroup <= total) return stripGroup;
  const idx = items.findIndex((item) => item.page === current.page);
  if (idx >= 0) return Math.max(1, Math.floor(idx / 50) + 1);
  return Math.max(1, Math.floor((current.page - 1) / 50) + 1);
}
function renderStripControls(items, group) {
  const input = document.getElementById("strip-group");
  const status = document.getElementById("strip-group-status");
  const total = stripGroupTotal(items);
  if (input) input.value = String(group);
  if (status) status.textContent = "strip group " + group + "/" + total;
}
function setStripGroup(group) {
  if (!current.id) return;
  const items = stripItems();
  const total = stripGroupTotal(items);
  stripGroup = Math.max(1, Math.min(total, Number(group) || 1));
  renderStrip();
}

function entryForPage(page) {
  return current.files[page - 1];
}

function doubleActive() { return viewMode !== "single" && window.innerWidth >= 720; }

function isAlreadyDoublePage(entry) {
  return entry && Number(entry.width) > Number(entry.height);
}

function displayModeFor(firstEntry) {
  if (viewMode === "fullscreen") return "fullscreen";
  if (isAlreadyDoublePage(firstEntry)) return "single landscape";
  if (viewMode === "single" || window.innerWidth < 720) return "single";
  return "double";
}

function displayMode() { return displayModeFor(entryForPage(current.page)); }

function readerClass(firstEntry = null) {
  const entry = firstEntry && firstEntry.entry ? firstEntry.entry : firstEntry || entryForPage(current.page);
  if (isAlreadyDoublePage(entry)) return "reader single landscape";
  if (viewMode === "fullscreen") return "reader fullscreen" + (doubleActive() ? " double" : "");
  return "reader " + displayModeFor(entry);
}

function displayPlaceholder(entry) { return ""; }

function readerItems() {
  const items = stripItems();
  const firstIdx = items.findIndex((item) => item.page === current.page);
  const first = firstIdx >= 0 ? items[firstIdx] : { page: current.page, entry: entryForPage(current.page), badge: 0 };
  const result = [first];
  if (doubleActive() && first.entry && !isAlreadyDoublePage(first.entry)) {
    let second = null;
    if (currentPairEnd > current.page) second = { page: currentPairEnd, entry: entryForPage(currentPairEnd), badge: 0 };
    else if (firstIdx >= 0 && firstIdx + 1 < items.length) second = items[firstIdx + 1];
    else {
      const e = entryForPage(first.page + 1);
      if (e) second = { page: first.page + 1, entry: e, badge: 0 };
    }
    if (second && second.entry) result.push(second);
  }
  return result;
}

function movePage(delta) {
  const items = readerItems();
  if (delta > 0) {
    const next = doubleActive() && items.length > 1 ? items[1].page + 1 : current.page + delta;
    if (next < 1 || next > current.count) return false;
    current.page = next;
    currentPairEnd = null;
    return true;
  }
  const distance = doubleActive() && items.length > 1 ? items[1].page - current.page : 0;
  const prev = current.page - distance - 1;
  if (prev < 1 || prev > current.count) return false;
  current.page = prev;
  currentPairEnd = null;
  return true;
}

function applyFullscreen() {
  document.body.classList.toggle("fullscreen", viewMode === "fullscreen");
  if (viewMode === "fullscreen" && document.documentElement.requestFullscreen) {
    document.documentElement.requestFullscreen().catch(() => {});
  } else if (document.fullscreenElement && viewMode !== "fullscreen") {
    document.exitFullscreen().catch(() => {});
  }
}

function setViewMode(mode) {
  viewMode = mode;
  const select = document.getElementById("view-mode");
  if (select) select.value = mode;
  applyFullscreen();
  renderReader();
  renderPosition();
  renderViewState();
  startFullPrefetch();
}

function parseReaderHash(hash) {
  const g = hash.match(/^#\/g\/(\d+)(?:\/(?:page\/)?(\d+)(?:[-\/](\d+))?)?$/);
  if (g) return { id: Number(g[1]), page: Number(g[2] || 1), end: g[3] ? Number(g[3]) : null };
  const p = hash.match(/^#(\d+)(?:[-\/](\d+))?$/);
  if (p && current.id) return { id: current.id, page: Number(p[1]), end: p[2] ? Number(p[2]) : null };
  return null;
}

function setPrefetchStatus(text) {
  const el = document.getElementById("prefetch-status");
  if (el) el.textContent = text;
}

function renderPosition() {
  const el = document.getElementById("reader-position");
  if (!el) return;
  if (!current.id) {
    el.textContent = "";
    return;
  }
  const second = doubleActive() ? (currentPairEnd || (readerItems().length > 1 ? readerItems()[1].page : null)) : null;
  const page = second ? current.page + "-" + second : String(current.page);
  el.textContent = "position: " + page + " / " + (current.count || "-");
}

function renderLoadingPosition(id, pageLabel, pairLabel) {
  const el = document.getElementById("reader-position");
  if (!el || !id) return;
  el.textContent = "position: " + pageLabel + pairLabel + " / -";
}

function renderViewState() {
  const el = document.getElementById("view-state");
  if (!el) return;
  if (!current.id) {
    el.textContent = "view: " + viewMode + "・spread " + spreadDirection + "・fullscreen " + (document.fullscreenElement ? "on" : "off");
    return;
  }
  const pair = doubleActive() ? (currentPairEnd || (readerItems().length > 1 ? readerItems()[1].page : null)) : null;
  const pageText = pair ? current.page + "-" + pair : String(current.page);
  el.textContent = "view: " + viewMode + "・display: " + displayMode() + "・spread " + spreadDirection + "・page " + pageText + " / " + (current.count || "-") + "・fullscreen " + (document.fullscreenElement ? "on" : "off");
}

function loadSpreadDirection() {
  try {
    const dir = localStorage.getItem(SPREAD_DIRECTION_STORAGE_KEY);
    if (dir === "rtl" || dir === "ltr") spreadDirection = dir;
  } catch (err) {}
}

function setSpreadDirection(dir) {
  spreadDirection = dir === "ltr" ? "ltr" : "rtl";
  try {
    localStorage.setItem(SPREAD_DIRECTION_STORAGE_KEY, spreadDirection);
  } catch (err) {}
  const button = document.getElementById("spread-direction");
  if (button) button.textContent = spreadDirection;
  renderReader();
  renderPosition();
  renderViewState();
  startFullPrefetch();
}

function galleryDataFromCard(card) {
  if (!card || !card.files) return null;
  const readState = card.read_state || { gallery_id: card.id, last_page: 1, fully_read: 0, favorite: 0 };
  return {
    gallery: {
      id: card.id, title: card.title, japanese_title: card.japanese_title,
      language: card.language, type: card.type, tags: card.tags || [], artists: card.artists || [],
      groups: card.groups || [], characters: card.characters || [], url: card.url || "",
      files: card.files, scene_indexes: card.scene_indexes || []
    },
    read_state: readState,
    local: card.local || 0,
    format: card.format || "webp"
  };
}

function renderGalleryLoading(id, page, second) {
  const reader = document.getElementById("reader");
  if (!reader) return;
  const pageLabel = page || 1;

function updatePrefetchCounts(status, entry, galleryId = current.id) {
  if (galleryId !== current.id || backgroundGalleryId !== galleryId) return;
  const key = fullCacheKey(entry, galleryId);
  setSourceStatus(entry, status, galleryId);
  if (prefetchedEntries.has(key)) {
    renderPrefetchStatus();
    return;
  }
  prefetchedEntries.set(key, status);
  const counts = getGalleryCounts(galleryId);
  if (status === "tn") counts.tnDone++;
  else if (status === "no_full") counts.noFullDone++;
  else if (status === "error") counts.errorDone++;
  else counts.fullDone++;
  renderPrefetchStatus();
}

function entrySource(entry, galleryId = current.id) {
  const formats = entry.local_formats || [];
  if (formats.length) {
    return "/files/" + galleryId + "/" + entry.hash + "." + formats[0];
  }
  return "/api/image/" + entry.hash + "?format=" + encodeURIComponent(entryFormat(entry, galleryId)) + "&gallery=" + encodeURIComponent(galleryId);
}
function storeFullCache(entry, status, objectUrl, galleryId = current.id) {
  const key = fullCacheKey(entry, galleryId);
  if (objectUrl && statusIsViewerDisplaySource(status) && !fullObjectUrls.has(objectUrl)) {
    fullObjectUrls.add(objectUrl);
    activeObjectUrlKeys.add(key);
  }
  fullCache.set(key, { status, objectUrl });
  setSourceStatus(entry, status, galleryId);
  if (objectUrl && statusIsViewerDisplaySource(status)) {
    setSourceType(entry, "objectURL", galleryId);
    if (galleryId === current.id && backgroundGalleryId === galleryId) {
      updateThumbCache(key, objectUrl);
    }
  }
  if (fullObjectUrls.size > MAX_FULL_CACHE_ENTRIES) {
    revokeFullObjectUrls();
  }
}

async function prefetchPageImage(entry, signal, galleryId = current.id) {
  if (galleryId !== current.id || backgroundGalleryId !== galleryId) return "error";
  const key = fullCacheKey(entry, galleryId);
  const cached = fullCache.get(key);
  if (cached && cached.objectUrl && statusIsViewerDisplaySource(cached.status)) return cached.status;
  if (entry.local_formats && entry.local_formats.length) {
    setSourceType(entry, "local-direct", galleryId);
    setSourceStatus(entry, "local", galleryId);
    updatePrefetchCounts("local", entry, galleryId);
    return "local";
  }
  const fullSrc = entrySource(entry, galleryId);
  const r = await fetch(fullSrc, { cache: "no-store", signal });
  if (signal.aborted) return "error";
  if (galleryId !== current.id || backgroundGalleryId !== galleryId) return "error";
  if (!r.ok) {
    const cache = r.headers.get("x-cache") || "error";
    storeFullCache(entry, cache, null, galleryId);
    updatePrefetchCounts(cache, entry, galleryId);
    return cache;
  }
  const cache = r.headers.get("x-cache") || "miss";
  if (galleryId !== current.id || backgroundGalleryId !== galleryId) return cache;
  if (cache === "tn") {
    storeFullCache(entry, "tn", null, galleryId);
    updatePrefetchCounts("tn", entry, galleryId);
    return cache;
  }
  const blob = await r.blob();
  if (galleryId !== current.id || backgroundGalleryId !== galleryId) return cache;
  const objectUrl = URL.createObjectURL(blob);
  storeFullCache(entry, cache, objectUrl, galleryId);
  updatePrefetchCounts(cache, entry, galleryId);
  return cache;
}

function revokeFullObjectUrls() {
  for (const objectUrl of fullObjectUrls) {
    URL.revokeObjectURL(objectUrl);
  }
  fullObjectUrls.clear();
  activeObjectUrlKeys.clear();
  for (const cached of fullCache.values()) {
    if (cached) cached.objectUrl = null;
  }
  renderPrefetchStatus();
}

async function loadFullImage(img, entry, signal, galleryId = current.id, loadShowGen = showGeneration, loadOpenGen = openGeneration, loadRender = renderGeneration) {
  const targetPage = Number(img.dataset.page);
  const targetHash = img.dataset.hash;
  const targetRender = Number(img.dataset.render);
  if (loadShowGen !== showGeneration || loadOpenGen !== openGeneration || loadRender !== renderGeneration) return;
  const key = fullCacheKey(entry, galleryId);
  if (activeObjectUrlKeys.has(key)) {
    img.dataset.fullCache = sourceStatusByEntry.get(key) || "cache";
    img.dataset.sourceType = "objectURL";
    img.src = fullCache.get(key).objectUrl;
    recordImageDisplayPassFromImg(img, galleryId);
    return;
  }
  if (entry.local_formats && entry.local_formats.length) {
    img.dataset.fullCache = "local";
    img.dataset.sourceType = "local-direct";
    setSourceStatus(entry, "local", galleryId);
    setSourceType(entry, "local-direct", galleryId);
    updatePrefetchCounts("local", entry, galleryId);
    img.src = localDirectSrc(entry, galleryId);
    recordImageDisplayPassFromImg(img, galleryId);
    return;
  }
  const fullSrc = entrySource(entry, galleryId);
  try {
    const r = await fetch(fullSrc, { cache: "no-store", signal });
    if (signal.aborted) return;
    if (loadShowGen !== showGeneration || loadOpenGen !== openGeneration || loadRender !== renderGeneration) return;
    const cache = r.headers.get("x-cache") || "miss";
    if (r.status === 404 && cache === "no_full") {
      storeFullCache(entry, "no_full", null, galleryId);
      updatePrefetchCounts("no_full", entry, galleryId);
      if (loadShowGen === showGeneration && loadOpenGen === openGeneration && loadRender === renderGeneration && Number(img.dataset.render) === targetRender && Number(img.dataset.page) === targetPage && img.dataset.hash === targetHash) {
        document.getElementById("note").textContent = "no full image: " + targetPage;
      }
      return;
    }
    if (!r.ok) {
      storeFullCache(entry, "error", null, galleryId);
      updatePrefetchCounts("error", entry, galleryId);
      if (loadShowGen === showGeneration && loadOpenGen === openGeneration && loadRender === renderGeneration && Number(img.dataset.render) === targetRender && Number(img.dataset.page) === targetPage && img.dataset.hash === targetHash) {
        document.getElementById("note").textContent = "image load failed: " + targetPage;
      }
      return;
    }
    if (cache === "tn") {
      storeFullCache(entry, "tn", null, galleryId);
      updatePrefetchCounts("tn", entry, galleryId);
      if (loadShowGen === showGeneration && loadOpenGen === openGeneration && loadRender === renderGeneration && Number(img.dataset.render) === targetRender && Number(img.dataset.page) === targetPage && img.dataset.hash === targetHash) {
        document.getElementById("note").textContent = "tn display fallback disabled: " + targetPage;
      }
      return;
    }
    const blob = await r.blob();
    const objectUrl = URL.createObjectURL(blob);
    if (loadShowGen !== showGeneration || loadOpenGen !== openGeneration || loadRender !== renderGeneration) {
      URL.revokeObjectURL(objectUrl);
      return;
    }
    storeFullCache(entry, cache, objectUrl, galleryId);
    updatePrefetchCounts(cache, entry, galleryId);
    if (loadShowGen === showGeneration && loadOpenGen === openGeneration && loadRender === renderGeneration && Number(img.dataset.render) === targetRender && Number(img.dataset.page) === targetPage && img.dataset.hash === targetHash) {
      img.dataset.fullCache = cache;
      img.dataset.sourceType = sourceTypeByEntry.get(key) || entrySourceType(entry, galleryId);
      img.src = objectUrl;
      recordImageDisplayPassFromImg(img, galleryId);
    }
  } catch (err) {
    if (signal.aborted) return;
    if (loadShowGen !== showGeneration || loadOpenGen !== openGeneration || loadRender !== renderGeneration) return;
    storeFullCache(entry, "error", null, galleryId);
    updatePrefetchCounts("error", entry, galleryId);
    if (loadShowGen === showGeneration && loadOpenGen === openGeneration && loadRender === renderGeneration && Number(img.dataset.render) === targetRender && Number(img.dataset.page) === targetPage && img.dataset.hash === targetHash) {
      document.getElementById("note").textContent = "image load failed: " + targetPage;
    }
  }
}

function resetBackgroundPrefetch(displayed) {
  if (!current.id) return;
  if (backgroundSignal) backgroundSignal.abort();
  backgroundSignal = new AbortController();
  prefetchAbort = backgroundSignal;
  backgroundGalleryId = current.id;
  const signal = backgroundSignal.signal;
  const currentId = current.id;
  const displayedPages = new Set(displayed.map((item) => item.page));
  const items = stripItems().filter((item) => item.entry);
  const currentIdx = items.findIndex((item) => item.page === current.page);
  const order = [];
  if (currentIdx >= 0) {
    for (let distance = 0; distance <= Math.max(items.length - currentIdx, currentIdx); distance++) {
      const right = currentIdx + distance;
      const left = currentIdx - distance;
      if (right < items.length && !displayedPages.has(items[right].page) && !prefetchedEntries.has(fullCacheKey(items[right].entry, currentId))) order.push({ entry: items[right].entry, page: items[right].page, galleryId: currentId });
      if (distance > 0 && left >= 0 && !displayedPages.has(items[left].page) && !prefetchedEntries.has(fullCacheKey(items[left].entry, currentId))) order.push({ entry: items[left].entry, page: items[left].page, galleryId: currentId });
    }
  } else {
    for (let i = 0; i < items.length; i++) {
      if (!displayedPages.has(items[i].page) && !prefetchedEntries.has(fullCacheKey(items[i].entry, currentId))) order.push({ entry: items[i].entry, page: items[i].page, galleryId: currentId });
    }
  }
  const counts = getGalleryCounts(currentId);
  counts.total = items.length;
  renderPrefetchStatus();
  prefetchQueue.length = 0;
  prefetchQueueKeys.clear();
  for (const item of order) {
    const key = fullCacheKey(item.entry, item.galleryId);
    if (prefetchQueueKeys.has(key)) continue;
    prefetchQueueKeys.add(key);
    prefetchQueue.push(item);
  }
  currentPriorityDone = runPriority(displayed, signal);
  startBackgroundWorkers(signal);
}

function ensureBackgroundPrefetch(displayed) {
  if (!current.id) return;

  }
  const signal = backgroundSignal.signal;
  currentPriorityDone = runPriority(displayed, signal);
}

function startFullPrefetch(displayed = readerItems()) {

}

function startBackgroundWorkers(signal) {
  async function worker() {
    while (prefetchQueue.length && !signal.aborted) {
      await currentPriorityDone;
      if (signal.aborted) return;
      const item = prefetchQueue.shift();
      try {
        const cache = await prefetchPageImage(item.entry, signal, item.galleryId);
        if (signal.aborted) return;
        updatePrefetchCounts(cache, item.entry, item.galleryId);
      } catch (err) {
        if (signal.aborted) return;
        updatePrefetchCounts("error", item.entry, item.galleryId);
      }
    }
  }
  for (let i = 0; i < PREFETCH_CONCURRENCY; i++) worker();
}

  if (prev) prev.disabled = page <= 1;
  if (next) next.disabled = total > 0 && page >= totalPages;
  status.textContent = "page " + page + " / " + (total ? totalPages : "-") + "・total " + total;
}
async function setSearchPage(delta) {
  const total = Number(currentSearchTotal || 0);
  const totalPages = searchTotalPages(total);
  const page = Number(document.getElementById("page").value || "1");
  const target = page + delta;
  if (!total || target < 1 || target > totalPages) return;
  document.getElementById("page").value = String(target);
  await runSearch();
}
async function loadSearchCards(ids, searchGen = searchGeneration) {
  const status = document.getElementById("search-status");
  const results = document.getElementById("results");
  for (let i = 0; i < ids.length; i++) {
    if (searchGen !== searchGeneration) return;
    status.textContent = "カード読み込み " + (i + 1) + "/" + ids.length + ": " + ids[i];
    const li = results.querySelector("[data-search-id='" + ids[i] + "']");
    try {
      const card = await api("/api/search-card/" + ids[i]);
      if (searchGen !== searchGeneration) return;
      if (li) {
        li.outerHTML = renderSearchCard(card);
        await loadSearchCardCover(card, searchGen);
      }
    } catch (err) {
      if (searchGen !== searchGeneration) return;
      if (li) li.innerHTML = "<span class='meta'>" + escapeHTML(err.message) + "</span>";
    }
  }
}

async function runSearch() {
  const query = document.getElementById("query").value.trim();
  const lang = document.getElementById("lang").value.trim() || "all";
  const page = Number(document.getElementById("page").value || "1");
  const searchGen = ++searchGeneration;
  const status = document.getElementById("search-status");
  const results = document.getElementById("results");
  const submit = document.getElementById("search-submit");
  const originalText = submit.dataset.original || submit.textContent;
  submit.dataset.original = originalText;
  status.textContent = "検索実行中: " + query;
  submit.disabled = true;
  submit.textContent = "実行中…";
  results.innerHTML = "<li class='meta'>検索実行中…</li>";
  try {
    const data = await api("/api/search?query=" + encodeURIComponent(query) + "&lang=" + encodeURIComponent(lang) + "&page=" + page + "&limit=25");
    if (searchGen !== searchGeneration) return;
    const ids = data.ids || (data.results || []).map((r) => r.id);
    currentSearchTotal = Number(data.total || 0);
    renderSearchPageStatus();
    document.getElementById("count").textContent = data.total + " 件・page " + data.page;
    status.textContent = "検索完了・カード読み込み " + ids.length + "件";
  results.innerHTML = ids.map((id) => "<li class='card' data-search-id='" + id + "' data-id='" + id + "' data-page='1'><div class='text'><a href='" + route(id, 1) + "'" + targetAttr() + ">#" + id + "</a><span class='meta'>loading</span></div></li>").join("") || "<li>0 件</li>";
    saveSearchState({ query, lang, page, ids, total: data.total });
    history.replaceState(null, "", searchRoute(query, page));
    await loadSearchCards(ids, searchGen);
    if (searchGen !== searchGeneration) return;
    await showLists();
    status.textContent = "検索完了・カード表示済み " + ids.length + "件";
  } catch (err) {
    if (searchGen !== searchGeneration) return;
    status.textContent = "検索エラー: " + err.message;
    document.getElementById("note").textContent = err.message;
  } finally {
    if (searchGen === searchGeneration) {
      submit.disabled = false;
      submit.textContent = originalText;
    }
  }
}

document.getElementById("search").addEventListener("submit", (e) => { e.preventDefault(); runSearch(); });
document.getElementById("search-prev").addEventListener("click", (e) => { e.preventDefault(); setSearchPage(-1); });
document.getElementById("search-next").addEventListener("click", (e) => { e.preventDefault(); setSearchPage(1); });
document.getElementById("query").addEventListener("submit", async (e) => {
  e.preventDefault();
  const name = document.getElementById("qname").value.trim();
  const text = document.getElementById("qtext").value.trim();
  if (!name || !text) return;
  try { await post("/api/query", { name, query: text }); await showLists(); }
  catch (err) { document.getElementById("note").textContent = err.message; }
});
document.getElementById("nav").addEventListener("submit", (e) => { e.preventDefault(); });
document.getElementById("prev").addEventListener("click", async () => { if (movePage(-1)) await showPage(); });
document.getElementById("next").addEventListener("click", async () => { if (movePage(1)) await showPage(); });
document.getElementById("pagenum").addEventListener("change", async () => {
  const page = Number(document.getElementById("pagenum").value || current.page);
  if (current.id && page >= 1 && page <= current.count) { current.page = page; await showPage(); }
});
document.getElementById("fav").addEventListener("click", async () => {
  if (!current.id) return;
  const on = !current.favorite;
  await post("/api/fav", { gallery_id: current.id, on });
  current.favorite = on ? 1 : 0;
  await showLists();
});
document.getElementById("complete").addEventListener("click", async () => {
  if (!current.id) return;
  await post("/api/read", { gallery_id: current.id, page: current.page, complete: true });
  current.favorite = current.favorite;
  await showLists();
});
document.getElementById("view-mode").addEventListener("change", (e) => setViewMode(e.target.value));
document.getElementById("view-mode-buttons").addEventListener("click", (e) => {
  const modeButton = e.target.closest("button[data-mode]");
  if (modeButton) {
    e.preventDefault();
    setViewMode(modeButton.dataset.mode);
    modeButton.blur();
    return;
  }
  const spreadButton = e.target.closest("button[id='spread-direction']");
  if (spreadButton) {
    e.preventDefault();
    setSpreadDirection(spreadDirection === "rtl" ? "ltr" : "rtl");
    spreadButton.blur();
  }
});
document.addEventListener("fullscreenchange", () => {
  if (!document.fullscreenElement && viewMode === "fullscreen") {
    viewMode = "single";
    const select = document.getElementById("view-mode");
    if (select) select.value = "single";
    applyFullscreen();
    renderReader();
    renderPosition();
    renderViewState();
    startFullPrefetch();
  }
});
document.getElementById("results").addEventListener("click", async (e) => {
  const t = e.target.closest("[data-id][data-page]");
  if (!t) return;
  e.preventDefault();
  await openGallery(Number(t.dataset.id), Number(t.dataset.page));
});
document.getElementById("thumbs").addEventListener("click", async (e) => {
  const t = e.target.closest("[data-id][data-page]");
  if (!t) return;
  e.preventDefault();
  await openGallery(Number(t.dataset.id), Number(t.dataset.page));
});
window.addEventListener("resize", () => {
  if (!current.id) return;
  renderReader();
  renderPosition();
  renderViewState();
  startFullPrefetch();
});
window.addEventListener("keydown", async (e) => {
  if (!current.id || e.target.tagName === "INPUT" || e.target.tagName === "BUTTON" || e.target.tagName === "SELECT") return;
  if (e.key === "ArrowLeft") { if (movePage(-1)) await showPage(); }
  if (e.key === "ArrowRight") { if (movePage(1)) await showPage(); }
  if (e.key === "d") setViewMode("double");
  if (e.key === "s") setViewMode("single");
  if (e.key === "f") {
    if (viewMode === "fullscreen" && document.fullscreenElement) {
      setViewMode("double");
    } else {
      setViewMode("fullscreen");
    }
  }
  if (e.key === "r") setSpreadDirection(spreadDirection === "rtl" ? "ltr" : "rtl");
});
document.getElementById("strip-prev-group").addEventListener("click", () => {
  setStripGroup(stripGroupPage(stripItems()) - 1);
});
document.getElementById("strip-next-group").addEventListener("click", () => {
  setStripGroup(stripGroupPage(stripItems()) + 1);
});
document.getElementById("strip-go-group").addEventListener("click", () => {
  setStripGroup(Number(document.getElementById("strip-group").value) || 1);
});
document.getElementById("strip-group").addEventListener("change", () => {
  setStripGroup(Number(document.getElementById("strip-group").value) || 1);
});

window.addEventListener("hashchange", async () => {
  const reader = parseReaderHash(window.location.hash);
  if (reader) { await openGallery(reader.id, reader.page, reader.end); return; }
  const search = parseSearchHash(window.location.hash);
  if (search) {
    document.getElementById("query").value = search.query;
    document.getElementById("page").value = String(search.page);
    renderSearchPageStatus();
    await runSearch();
  }
});

loadSpreadDirection();
const spreadButton = document.getElementById("spread-direction");
if (spreadButton) spreadButton.textContent = spreadDirection;
showLists();
const initialSearch = parseSearchHash(window.location.hash);
if (initialSearch) {
  restoreSearchState();
  document.getElementById("query").value = initialSearch.query;
  document.getElementById("page").value = String(initialSearch.page);
  renderSearchPageStatus();
  runSearch();
} else {
  restoreSearchState();
  const initial = parseReaderHash(window.location.hash);
  if (initial) {
    openGallery(initial.id, initial.page, initial.end);
  } else {
    runSearch();
  }
}
</script>
</body>
</html>
