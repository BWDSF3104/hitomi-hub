<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>hitomi hub viewer</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 1rem; background: #14161a; color: #e8eaed; }
  h1 { font-size: 1.1rem; margin: 0 0 .8rem; }
  .cols { display: flex; gap: 1rem; align-items: flex-start; }
  .side { width: 30rem; }
  .main { flex: 1; min-width: 20rem; }
  section { margin-bottom: 1rem; }
  h2 { font-size: .95rem; margin: 0 0 .4rem; color: #9aa0a6; }
  form { display: flex; gap: .4rem; flex-wrap: wrap; align-items: center; }
  input { padding: .35rem; background: #1d2126; color: #e8eaed; border: 1px solid #2f343b; }
  button { padding: .35rem .6rem; background: #2f343b; color: #e8eaed; border: 0; cursor: pointer; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: .3rem 0; border-bottom: 1px solid #23272d; }
  a { color: #8ab4f8; text-decoration: none; }
  .meta { font-size: .9rem; color: #9aa0a6; }
  .note { font-size: .85rem; color: #f0a441; }
  .status { font-size: .85rem; color: #8ab4f8; margin-bottom: .4rem; }
  .card { display: flex; gap: .5rem; align-items: flex-start; }
  .cover, .strip img { object-fit: cover; background: #1d2126; }
  .cover { width: 130px; height: 130px; }
  .card a { font-weight: 600; }
  .tags, .strip { margin-top: .35rem; }
  .strip { display: flex; gap: .3rem; flex-wrap: wrap; }
  .strip img { width: 90px; height: 90px; }
  .strip a { position: relative; }
  .badge { position: absolute; right: 4px; top: 4px; background: #8ab4f8; color: #14161a; padding: 2px 5px; border-radius: 4px; font-size: .8rem; }
  .current { border: 2px solid #8ab4f8; }
  .pageimg { max-width: 100%; max-height: 78vh; background: #1d2126; object-fit: contain; }
  .reader {
    --reader-page-width: min(45vw, 500px);
    --reader-page-height: min(78vh, 700px);
    display: grid;
    gap: 0;
    grid-template-columns: repeat(2, minmax(0, var(--reader-page-width)));
  }
  .reader.double { grid-template-columns: repeat(2, minmax(0, var(--reader-page-width))); }
  .reader:not(.double) { grid-template-columns: minmax(0, var(--reader-page-width)); }
  .reader img {
    display: block;
    width: min(var(--reader-page-width), 100%);
    height: var(--reader-page-height);
    background: #1d2126;
    object-fit: contain;
  }
  body.fullscreen .side { display: none; }
  body.fullscreen .reader { --reader-page-height: min(90vh, 700px); }
  body.fullscreen .reader img { height: var(--reader-page-height); }
</style>
</head>
<body>
<h1>hitomi hub viewer（ローカル 1 ページ）</h1>
<div class="cols">
  <div class="side">
    <section>
      <h2>検索（hitomi search.html と同じ term routing）</h2>
      <form id="search">
        <input id="query" value="furry" size="30" placeholder="furry / female:yuri language:english">
        <input id="lang" value="all" size="8">
        <input id="page" value="1" size="4">
        <button id="search-submit">検索</button>
      </form>
      <div id="search-status" class="status"></div>
      <div id="count" class="meta"></div>
      <ul id="results"></ul>
    </section>
    <section>
      <h2>保存検索</h2>
      <form id="query">
        <input id="qname" placeholder="name" size="10">
        <input id="qtext" placeholder="female:yuri language:english" size="22">
        <button>save</button>
      </form>
      <ul id="queries"></ul>
    </section>
    <section>
      <h2>お気に入り / 未読</h2>
      <ul id="favorites"></ul>
      <ul id="unread"></ul>
    </section>
  </div>
  <div class="main">
    <section>
      <h2>閲覧</h2>
      <div id="gallery" class="meta">検索結果から gallery を選ぶ</div>
      <div id="reader-controls" class="meta">
        <select id="view-mode">
          <option value="double">見開き（通常）</option>
          <option value="single">単一</option>
          <option value="fullscreen">フルスクリーン</option>
        </select>
        <span class="meta">キーボード: ← / → / d=見開き / s=単一 / f=フルスクリーン</span>
      </div>
      <div id="note" class="note"></div>
      <div id="prefetch-status" class="status"></div>
      <div id="reader" class="reader double"></div>
      <form id="nav">
        <button id="prev">前</button>
        <input id="pagenum" size="4">
        <button id="next">次</button>
        <button id="complete">読み完了</button>
        <button id="fav">お気に入り</button>
      </form>
      <div class="meta">キーボード: ← / → でページ送リ。通常サイズでは見開き。</div>
      <div class="strip" id="thumbs"></div>
    </section>
  </div>
</div>
<script>
const api = (p) => fetch(p).then(async (r) => {
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || (r.status + " " + p));
  return data;
});
const post = (p, body) => fetch(p, { method: "POST", headers: { "content-type": "application/json" },
  body: JSON.stringify(body) }).then(async (r) => {
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || (r.status + " " + p));
  return data;
});

let current = { id: 0, page: 1, count: 0, favorite: 0, files: [] };
let viewMode = "double";
let currentPairEnd = null;
let prefetchAbort = null;
let fullDone = 0;
let tnDone = 0;
let errorDone = 0;
let prefetchTotal = 0;
const PREFETCH_CONCURRENCY = 2;

function escapeHTML(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}
function route(id, page, second) {
  if (second) return "#/g/" + id + "/page/" + page + "-" + second;
  return "#/g/" + id + "/page/" + page;
}
function setRoute(id, page) {
  const items = readerItems();
  const second = doubleActive() && items.length > 1 ? items[1].page : null;
  history.replaceState(null, "", route(id, page, second));
}
function setGalleryMeta(data) {
  const g = data.gallery, s = data.read_state;
  const sceneIndexes = g.scene_indexes || [];
  const count = sceneIndexes.length ? sceneIndexes.length - 1 : g.files.length;
  current = {
    id: g.id, page: current.page || s.last_page || 1, count, favorite: s.favorite, files: g.files,
    sceneIndexes, format: data.format || "webp"
  };
  document.getElementById("gallery").innerHTML =
    "<b>" + escapeHTML(g.title || current.id) + "</b> <span class='meta'>" + escapeHTML(g.language) + " / " + escapeHTML(g.type) + "</span><br>" +
    "<span class='meta'>" + escapeHTML((g.artists || []).join(", ")) + "</span><br>" +
    "<span class='meta'>" + escapeHTML((g.tags || []).join(", ")) + "</span><br>" +
    "<span class='meta'>" + current.count + " files・local " + data.local + "（format " + escapeHTML(data.format) + "）</span>";
  document.getElementById("pagenum").value = current.page;
}
function fileFormatFromName(name) {
  const ext = String(name || "").split(".").pop().toLowerCase();
  if (ext === "jpeg") return "jpg";
  return ext || "webp";
}

function thumbURL(hash, format, gallery, variant) {
  if (!hash) return "";
  let u = "/api/thumb/" + hash + "?format=" + encodeURIComponent(format || "webp");
  if (gallery) u += "&gallery=" + encodeURIComponent(gallery);
  if (variant) u += "&variant=" + encodeURIComponent(variant);
  return u;
}

function stripVariant() {
  return window.devicePixelRatio === 1 ? "smallsmalltn" : "smalltn";
}
function formatForEntry(entry) {
  return entry.hasavif ? "avif" : (current.format || "webp");
}
function stripItems() {
  if (current.sceneIndexes && current.sceneIndexes.length) {
    return current.sceneIndexes.slice(0, current.sceneIndexes.length - 1).map((sceneIndex, idx) => ({
      page: sceneIndex + 1,
      entry: current.files[sceneIndex],
      badge: current.sceneIndexes[idx + 1] ? current.sceneIndexes[idx + 1] - sceneIndex : 0
    }));
  }
  return current.files.map((entry, idx) => ({ page: idx + 1, entry, badge: 0 }));
}
function stripGroupPage(items) {
  const idx = items.findIndex((item) => item.page === current.page);
  if (idx >= 0) return Math.max(1, Math.floor(idx / 50) + 1);
  return Math.max(1, Math.floor((current.page - 1) / 50) + 1);
}

function entryForPage(page) {
  return current.files[page - 1];
}

function doubleActive() { return viewMode !== "single" && window.innerWidth >= 720; }

function displayMode() {
  if (viewMode === "fullscreen") return "fullscreen";
  if (viewMode === "single" || window.innerWidth < 720) return "single";
  return "double";
}

function readerClass() {
  if (viewMode === "fullscreen") return "reader fullscreen" + (doubleActive() ? " double" : "");
  return "reader " + displayMode();
}

function entryPlaceholder(entry) { return thumbURL(entry.hash, formatForEntry(entry), current.id, stripVariant()); }

function readerItems() {
  const items = stripItems();
  const firstIdx = items.findIndex((item) => item.page === current.page);
  const first = firstIdx >= 0 ? items[firstIdx] : { page: current.page, entry: entryForPage(current.page), badge: 0 };
  const result = [first];
  if (doubleActive() && first.entry) {
    let second = null;
    if (currentPairEnd > current.page) second = { page: currentPairEnd, entry: entryForPage(currentPairEnd), badge: 0 };
    else if (firstIdx >= 0 && firstIdx + 1 < items.length) second = items[firstIdx + 1];
    else {
      const e = entryForPage(first.page + 1);
      if (e) second = { page: first.page + 1, entry: e, badge: 0 };
    }
    if (second && second.entry) result.push(second);
  }
  return result;
}

function movePage(delta) {
  const items = readerItems();
  if (delta > 0) {
    const next = doubleActive() && items.length > 1 ? items[1].page + 1 : current.page + delta;
    if (next < 1 || next > current.count) return false;
    current.page = next;
    currentPairEnd = null;
    return true;
  }
  const distance = doubleActive() && items.length > 1 ? items[1].page - current.page : 0;
  const prev = current.page - distance - 1;
  if (prev < 1 || prev > current.count) return false;
  current.page = prev;
  currentPairEnd = null;
  return true;
}

function applyFullscreen() {
  document.body.classList.toggle("fullscreen", viewMode === "fullscreen");
  if (viewMode === "fullscreen" && document.documentElement.requestFullscreen) {
    document.documentElement.requestFullscreen().catch(() => {});
  } else if (document.fullscreenElement && viewMode !== "fullscreen") {
    document.exitFullscreen().catch(() => {});
  }
}

function setViewMode(mode) {
  viewMode = mode;
  const select = document.getElementById("view-mode");
  if (select) select.value = mode;
  applyFullscreen();
  renderReader();
  startFullPrefetch();
}

function parseReaderHash(hash) {
  const g = hash.match(/^#\/g\/(\d+)(?:\/(?:page\/)?(\d+)(?:[-\/](\d+))?)?$/);
  if (g) return { id: Number(g[1]), page: Number(g[2] || 1), end: g[3] ? Number(g[3]) : null };
  const p = hash.match(/^#(\d+)(?:[-\/](\d+))?$/);
  if (p && current.id) return { id: current.id, page: Number(p[1]), end: p[2] ? Number(p[2]) : null };
  return null;
}

function setPrefetchStatus(text) {
  const el = document.getElementById("prefetch-status");
  if (el) el.textContent = text;
}

function updatePrefetchCounts(status) {
  if (status === "tn") tnDone++;
  else if (status === "error") errorDone++;
  else fullDone++;
  let text = "full prefetch " + fullDone + "/" + prefetchTotal + " tn " + tnDone + "/" + prefetchTotal;
  if (errorDone) text += " error " + errorDone + "/" + prefetchTotal;
  setPrefetchStatus(text);
}

function entrySource(entry) {
  const formats = entry.local_formats || [];
  if (formats.length) {
    return "/files/" + current.id + "/" + entry.hash + "." + formats[0];
  }
  return "/api/image/" + entry.hash + "?format=" + encodeURIComponent(formatForEntry(entry)) + "&gallery=" + encodeURIComponent(current.id);
}

async function prefetchPageImage(entry, signal) {
  const r = await fetch(entrySource(entry), { signal });
  return r.headers.get("x-cache") || "miss";
}

async function loadFullImage(img, entry, signal) {
  const targetPage = Number(img.dataset.page);
  const targetHash = img.dataset.hash;
  const fullSrc = entrySource(entry);
  try {
    const r = await fetch(fullSrc, { signal });
    if (signal.aborted) return;
    const cache = r.headers.get("x-cache") || "miss";
    updatePrefetchCounts(cache);
    if (Number(img.dataset.page) === targetPage && img.dataset.hash === targetHash) {
      img.dataset.fullCache = cache;
      img.src = fullSrc;
    }
  } catch (err) {
    if (signal.aborted) return;
    updatePrefetchCounts("error");
    if (Number(img.dataset.page) === targetPage && img.dataset.hash === targetHash) {
      document.getElementById("note").textContent = "image load failed: " + targetPage;
    }
  }
}

function renderReader() {
  const container = document.getElementById("reader");
  if (!container || !current.id) return;
  const items = readerItems();
  container.className = readerClass();
  const parts = [];
  for (const item of items) {
    const entry = item.entry;
    if (!entry) continue;
    const marker = entry.local ? " title='local'" : "";
    const alt = item.page + (entry.local ? "・local" : "");
    parts.push("<img data-page='" + item.page + "' data-hash='" + entry.hash + "' data-full='" + entrySource(entry) + "' src='" + entryPlaceholder(entry) + "'" + marker + " alt='" + alt + "'>");
  }
  container.innerHTML = parts.join("");
}

function startFullPrefetch() {
  if (!current.id) return;
  if (prefetchAbort) prefetchAbort.abort();
  prefetchAbort = new AbortController();
  const signal = prefetchAbort.signal;
  const displayed = readerItems().filter((item) => item.entry);
  const displayedPages = new Set(displayed.map((item) => item.page));
  const items = stripItems().filter((item) => item.entry);
  const currentIdx = items.findIndex((item) => item.page === current.page);
  const order = [];
  if (currentIdx >= 0) {
    for (let distance = 0; distance <= Math.max(items.length - currentIdx, currentIdx); distance++) {
      const right = currentIdx + distance;
      const left = currentIdx - distance;
      if (right < items.length && !displayedPages.has(items[right].page)) order.push(items[right]);
      if (distance > 0 && left >= 0 && !displayedPages.has(items[left].page)) order.push(items[left]);
    }
  } else {
    for (let i = 0; i < items.length; i++) {
      if (!displayedPages.has(items[i].page)) order.push(items[i]);
    }
  }
  prefetchTotal = displayed.length + order.length;
  fullDone = 0;
  tnDone = 0;
  errorDone = 0;
  setPrefetchStatus("full prefetch 0/" + prefetchTotal + " tn 0/" + prefetchTotal);
  const container = document.getElementById("reader");
  for (const item of displayed) {
    const img = container && container.querySelector("img[data-page='" + item.page + "']");
    if (img) loadFullImage(img, item.entry, signal);
  }
  async function worker() {
    while (order.length && !signal.aborted) {
      const item = order.shift();
      try {
        const cache = await prefetchPageImage(item.entry, signal);
        if (signal.aborted) return;
        updatePrefetchCounts(cache);
      } catch (err) {
        if (signal.aborted) return;
        updatePrefetchCounts("error");
      }
    }
  }
  for (let i = 0; i < PREFETCH_CONCURRENCY; i++) worker();
}

async function showPage() {
  if (!current.id) return;
  const entry = current.files[current.page - 1];
  if (!entry) {
    document.getElementById("note").textContent = "page out of range";
    return;
  }
  const data = { page: current.page, src: entrySource(entry), local: !!entry.local, format: formatForEntry(entry) };
  renderReader();
  startFullPrefetch();
  document.getElementById("note").textContent = data.local ? "local" : "cdn/TN（未ダウンロード）";
  document.getElementById("pagenum").value = current.page;
  setRoute(current.id, current.page);
  await post("/api/read", { gallery_id: current.id, page: current.page });
  await showLists();
  highlightStrip();
}
function renderStrip() {
  const parts = [];
  const items = stripItems();
  const group = stripGroupPage(items);
  const start = (group - 1) * 50;
  const end = Math.min(start + 50, items.length);
  const variant = stripVariant();
  for (let i = start; i < end; i++) {
    const item = items[i];
    const entry = item.entry;
    const page = item.page;
    const src = thumbURL(entry.hash, formatForEntry(entry), current.id, variant);
    const marker = entry.local ? " title='local'" : "";
    const localMark = entry.local ? "・local" : "";
    const badge = item.badge > 1 ? "<div class='badge'>" + item.badge + "</div>" : "";
    parts.push("<a href='" + route(current.id, page) + "'" + marker + "><img class='" + (page === current.page ? "current" : "") + "' data-id='" + current.id + "' data-page='" + page + "' data-local='" + (entry.local ? "1" : "0") + "' loading='lazy' src='" + src + "' alt='" + page + localMark + "'>" + badge + "</a>");
  }
  document.getElementById("thumbs").innerHTML = parts.join("");
}
function highlightStrip() {
  const pages = readerItems().map((item) => item.page);
  document.querySelectorAll("#thumbs img").forEach((img) => {
    img.classList.toggle("current", pages.includes(Number(img.dataset.page)));
  });
}
async function openGallery(id, page, second) {
  const data = await api("/api/gallery/" + id);
  setGalleryMeta(data);
  if (page) current.page = page;
  currentPairEnd = second || null;
  await showPage();
  renderStrip();
  await showLists();
}
async function showLists() {
  const lists = await api("/api/lists");
  document.getElementById("queries").innerHTML = lists.queries.map((q) =>
    "<li><a href='#/q/" + encodeURIComponent(q.query) + "'>" + escapeHTML(q.name) + "</a> <span class='meta'>" + escapeHTML(q.query) + "</span></li>").join("") || "<li>なし</li>";
  document.getElementById("favorites").innerHTML = lists.favorites.map((row) =>
    "<li><a href='" + route(row.gallery_id, row.last_page || 1) + "'>" + escapeHTML(row.gallery_id) + "</a> <span class='meta'>p" + row.last_page + (row.fully_read ? " 既読" : "") + "</span></li>").join("") || "<li>なし</li>";
  document.getElementById("unread").innerHTML = lists.unread.map((row) =>
    "<li><a href='" + route(row.gallery_id, row.last_page || 1) + "'>" + escapeHTML(row.gallery_id) + "</a> <span class='meta'>p" + row.last_page + "</span></li>").join("") || "<li>なし</li>";
}
function renderSearchCard(r) {
  const cover = r.thumbnail ? "<img class='cover' loading='lazy' src='" + r.thumbnail + "' alt='cover'>" : "";
  return "<li class='card' data-id='" + r.id + "' data-page='1'><a href='" + route(r.id, 1) + "'>" + cover + "</a><div class='text'><a href='" + route(r.id, 1) + "'>" + escapeHTML(r.title || r.error || r.id) + "</a><div class='meta'>" + escapeHTML(r.language || "") + " / " + escapeHTML(r.type || "") + "・" + (r.count ?? 0) + " files・local " + (r.local ?? 0) + "</div><div class='tags meta'>" + escapeHTML((r.tags || []).join(", ")) + "</div></div></li>";
}

async function loadSearchCards(ids) {
  const status = document.getElementById("search-status");
  const results = document.getElementById("results");
  for (let i = 0; i < ids.length; i++) {
    status.textContent = "カード読み込み " + (i + 1) + "/" + ids.length + ": " + ids[i];
    const li = results.querySelector("[data-search-id='" + ids[i] + "']");
    try {
      const card = await api("/api/search-card/" + ids[i]);
      if (li) li.outerHTML = renderSearchCard(card);
    } catch (err) {
      if (li) li.innerHTML = "<span class='meta'>" + escapeHTML(err.message) + "</span>";
    }
  }
}

async function runSearch() {
  const q = document.getElementById("query").value.trim();
  const lang = document.getElementById("lang").value.trim() || "all";
  const page = Number(document.getElementById("page").value || "1");
  const status = document.getElementById("search-status");
  const results = document.getElementById("results");
  const submit = document.getElementById("search-submit");
  const originalText = submit.dataset.original || submit.textContent;
  submit.dataset.original = originalText;
  status.textContent = "検索実行中: " + q;
  submit.disabled = true;
  submit.textContent = "実行中…";
  results.innerHTML = "<li class='meta'>検索実行中…</li>";
  try {
    const data = await api("/api/search?query=" + encodeURIComponent(q) + "&lang=" + encodeURIComponent(lang) + "&page=" + page + "&limit=25");
    const ids = data.ids || (data.results || []).map((r) => r.id);
    document.getElementById("count").textContent = data.total + " 件・page " + data.page;
    status.textContent = "検索完了・カード読み込み " + ids.length + "件";
    results.innerHTML = ids.map((id) => "<li class='card' data-search-id='" + id + "' data-id='" + id + "' data-page='1'><div class='text'><a href='" + route(id, 1) + "'>#" + id + "</a><span class='meta'>loading</span></div></li>").join("") || "<li>0 件</li>";
    await loadSearchCards(ids);
    await showLists();
    status.textContent = "検索完了・カード表示済み " + ids.length + "件";
  } catch (err) {
    status.textContent = "検索エラー: " + err.message;
    document.getElementById("note").textContent = err.message;
  } finally {
    submit.disabled = false;
    submit.textContent = originalText;
  }
}

document.getElementById("search").addEventListener("submit", (e) => { e.preventDefault(); runSearch(); });
document.getElementById("query").addEventListener("submit", async (e) => {
  e.preventDefault();
  const name = document.getElementById("qname").value.trim();
  const text = document.getElementById("qtext").value.trim();
  if (!name || !text) return;
  try { await post("/api/query", { name, query: text }); await showLists(); }
  catch (err) { document.getElementById("note").textContent = err.message; }
});
document.getElementById("nav").addEventListener("submit", (e) => { e.preventDefault(); });
document.getElementById("prev").addEventListener("click", async () => { if (movePage(-1)) await showPage(); });
document.getElementById("next").addEventListener("click", async () => { if (movePage(1)) await showPage(); });
document.getElementById("pagenum").addEventListener("change", async () => {
  const page = Number(document.getElementById("pagenum").value || current.page);
  if (current.id && page >= 1 && page <= current.count) { current.page = page; await showPage(); }
});
document.getElementById("fav").addEventListener("click", async () => {
  if (!current.id) return;
  const on = !current.favorite;
  await post("/api/fav", { gallery_id: current.id, on });
  current.favorite = on ? 1 : 0;
  await showLists();
});
document.getElementById("complete").addEventListener("click", async () => {
  if (!current.id) return;
  await post("/api/read", { gallery_id: current.id, page: current.page, complete: true });
  current.favorite = current.favorite;
  await showLists();
});
document.getElementById("view-mode").addEventListener("change", (e) => setViewMode(e.target.value));
document.addEventListener("fullscreenchange", () => {
  if (!document.fullscreenElement && viewMode === "fullscreen") {
    viewMode = "single";
    const select = document.getElementById("view-mode");
    if (select) select.value = "single";
    applyFullscreen();
    renderReader();
    startFullPrefetch();
  }
});
document.getElementById("results").addEventListener("click", async (e) => {
  const t = e.target.closest("[data-id][data-page]");
  if (!t) return;
  e.preventDefault();
  await openGallery(Number(t.dataset.id), Number(t.dataset.page));
});
document.getElementById("thumbs").addEventListener("click", async (e) => {
  const t = e.target.closest("[data-id][data-page]");
  if (!t) return;
  e.preventDefault();
  await openGallery(Number(t.dataset.id), Number(t.dataset.page));
});
window.addEventListener("keydown", async (e) => {
  if (!current.id || e.target.tagName === "INPUT" || e.target.tagName === "BUTTON" || e.target.tagName === "SELECT") return;
  if (e.key === "ArrowLeft") { if (movePage(-1)) await showPage(); }
  if (e.key === "ArrowRight") { if (movePage(1)) await showPage(); }
  if (e.key === "d") setViewMode("double");
  if (e.key === "s") setViewMode("single");
  if (e.key === "f") setViewMode("fullscreen");
});
window.addEventListener("hashchange", async () => {
  const reader = parseReaderHash(window.location.hash);
  if (reader) { await openGallery(reader.id, reader.page, reader.end); return; }
  const q = window.location.hash.match(/^#\/q\/(.+)$/);
  if (q) {
    const text = decodeURIComponent(q[1]);
    document.getElementById("query").value = text;
    await runSearch();
  }
});

showLists();
const initial = parseReaderHash(window.location.hash);
if (initial) {
  openGallery(initial.id, initial.page, initial.end);
} else {
  const initialQ = window.location.hash.match(/^#\/q\/(.+)$/);
  if (initialQ) { document.getElementById("query").value = decodeURIComponent(initialQ[1]); runSearch(); }
  else runSearch();
}
</script>
</body>
</html>
